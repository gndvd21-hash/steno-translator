<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gregg Shorthand Translator</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #222;
    }

    .container {
        max-width: 1200px;
        margin: auto;
        padding: 25px;
    }

    h1 {
        margin-top: 0;
        margin-bottom: 5px;
    }

    .subtitle {
        color: #666;
        margin-bottom: 20px;
    }

    textarea {
        width: 100%;
        min-height: 130px;
        resize: vertical;
        padding: 15px;
        border: 1px solid #ccc;
        border-radius: 10px;
        font-size: 18px;
        outline: none;
    }

    textarea:focus {
        border-color: #777;
    }

    .controls {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin: 15px 0 20px;
    }

    select,
    button {
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid #bbb;
        background: white;
        font-size: 15px;
        cursor: pointer;
    }

    button:hover {
        background: #eee;
    }

    #status {
        font-size: 14px;
        color: #666;
        margin-bottom: 15px;
    }

    .results {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 15px;
    }

    .card {
        background: white;
        border-radius: 12px;
        padding: 15px;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
        overflow: hidden;
    }

    .word {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 5px;
        text-transform: lowercase;
    }

    .source {
        font-size: 12px;
        color: #888;
        margin-bottom: 10px;
    }

    .outline {
        width: 100%;
        height: 150px;
        overflow: hidden;
        position: relative;
        background: #fff;
        border-radius: 8px;
    }

    .outline img {
        position: absolute;
        max-width: none;
        user-select: none;
        pointer-events: none;
    }

    .missing {
        color: #999;
        font-style: italic;
        padding: 30px 5px;
        text-align: center;
    }

    .phrase-card {
        grid-column: 1 / -1;
        background: #fffdf3;
        border: 1px solid #eadf9d;
    }

    .phrase-title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 4px;
    }

    .phrase-note {
        font-size: 13px;
        color: #777;
        margin-bottom: 12px;
    }

    .phrase-words {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    .mini-word {
        background: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 8px;
        width: 180px;
    }

    .mini-word-title {
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 5px;
    }

    .mini-outline {
        height: 90px;
        overflow: hidden;
        position: relative;
        background: white;
    }

    .mini-outline img {
        position: absolute;
        max-width: none;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Gregg Shorthand Translator</h1>

    <div class="subtitle">
        English → Gregg Shorthand
    </div>

    <textarea id="inputText"
        placeholder="Type something...&#10;&#10;Example: dear sir i am ready to do things"></textarea>

    <div class="controls">

        <label>
            Series:
            <select id="series">
                <option value="Anniversary">Anniversary</option>
                <option value="Simplified">Simplified</option>
            </select>
        </label>

        <button id="translateBtn">Translate</button>

        <button id="clearBtn">Clear</button>

    </div>

    <div id="status">
        Loading Gregg dictionary...
    </div>

    <div id="results" class="results"></div>

</div>

<script>

/* ============================================================
   GREGGDICT
   ============================================================ */

const BASE =
    "https://raw.githubusercontent.com/richyliu/greggdict/master/assets/";

const DISPLAY_SIZE = {
    x: 365,
    y: 100,
    offset: 5
};

const DISPLAY_SIZE_LARGE = {
    x: 450,
    y: 180,
    offset: 10
};

const IMG_WIDTH = 1281;


/* ============================================================
   DICTIONARIES
   ============================================================ */

let dictionaries = {
    Anniversary: [],
    Simplified: []
};


/* ============================================================
   COMMON ANNIVERSARY PHRASES
   These are phrase recognizers only.
   The actual outlines still come from greggdict.
   ============================================================ */

const COMMON_PHRASES = [

    "dear sir",
    "dear madam",
    "i am",
    "i am not",
    "i can",
    "i cannot",
    "i do",
    "i do not",
    "i will",
    "i will not",
    "i shall",
    "i shall not",
    "i have",
    "i have not",

    "you are",
    "you are not",
    "you can",
    "you cannot",
    "you will",
    "you will not",
    "you have",
    "you have not",

    "we are",
    "we are not",
    "we will",
    "we will not",
    "we shall",
    "we shall not",
    "we can",
    "we cannot",
    "we have",
    "we have not",

    "he was",
    "he will",
    "he can",

    "she was",
    "she will",
    "she can",

    "to the",
    "of the",
    "and the",
    "that the",
    "at the",
    "by the",
    "in the",
    "with the",

    "to you",
    "of you",
    "to me",
    "to my",

    "it is",
    "it was",

    "at once",
    "in my opinion",
    "in the first place",
    "at the same time",
    "in other words",
    "once in a while",
    "as soon as possible",
    "as a matter of fact"
];


/* ============================================================
   NORMALIZATION
   ============================================================ */

function normalizeWord(word) {

    return word
        .toLowerCase()
        .replace(/[“”‘’]/g, "")
        .replace(/^[^a-z]+|[^a-z]+$/gi, "");

}


function tokenize(text) {

    return text
        .split(/\s+/)
        .map(normalizeWord)
        .filter(Boolean);

}


/* ============================================================
   LOAD DICTIONARY
   ============================================================ */

async function loadDictionary(series) {

    if (dictionaries[series].length > 0) {
        return dictionaries[series];
    }

    const url =
        BASE + series + "/reference.json?cb=" + Date.now();

    const response = await fetch(url);

    if (!response.ok) {
        throw new Error(
            "Could not load " + series + " dictionary."
        );
    }

    const data = await response.json();

    dictionaries[series] = data;

    return data;
}


/* ============================================================
   FIND WORD
   ============================================================ */

function findWord(dictionary, word) {

    const target = word.toLowerCase();

    for (const page of dictionary) {

        if (!page.words) continue;

        for (const item of page.words) {

            if (!item.t) continue;

            if (
                item.t.toLowerCase() === target
            ) {

                return {
                    page: page.page,
                    x: Number(item.x),
                    y: Number(item.y),
                    t: item.t
                };

            }

        }

    }

    return null;
}


/* ============================================================
   DICTIONARY IMAGE
   ============================================================ */

function dictionaryPageUrl(series, page) {

    const pageNumber =
        String(page).padStart(3, "0");

    return (
        BASE +
        series +
        "/pages/" +
        pageNumber +
        ".png"
    );
}


/* ============================================================
   RENDER WORD
   ============================================================ */

function renderDictionaryWord(
    container,
    series,
    entry,
    large = false
) {

    const displaySize =
        large
            ? DISPLAY_SIZE_LARGE
            : DISPLAY_SIZE;

    const img =
        document.createElement("img");

    img.src =
        dictionaryPageUrl(
            series,
            entry.page
        ) +
        "?cb=" +
        Date.now();

    img.onload = function () {

        const naturalWidth =
            img.naturalWidth || IMG_WIDTH;

        const scale =
            IMG_WIDTH / naturalWidth;

        img.style.width =
            IMG_WIDTH + "px";

        const top =
            -(
                entry.y * scale -
                displaySize.y / 2
            );

        const left =
            -(
                entry.x * scale -
                displaySize.offset
            );

        img.style.top =
            top + "px";

        img.style.left =
            left + "px";

    };

    container.appendChild(img);
}


/* ============================================================
   WORD CARD
   ============================================================ */

function createWordCard(
    word,
    dictionary,
    series
) {

    const card =
        document.createElement("div");

    card.className = "card";

    const title =
        document.createElement("div");

    title.className = "word";

    title.textContent = word;

    card.appendChild(title);

    const source =
        document.createElement("div");

    source.className = "source";

    source.textContent =
        series + " Dictionary";

    card.appendChild(source);

    const outline =
        document.createElement("div");

    outline.className = "outline";

    card.appendChild(outline);

    const entry =
        findWord(
            dictionary,
            word
        );

    if (!entry) {

        outline.innerHTML =
            '<div class="missing">' +
            'No exact dictionary entry found.' +
            '</div>';

        return card;
    }

    renderDictionaryWord(
        outline,
        series,
        entry
    );

    return card;
}


/* ============================================================
   PHRASE MATCHING
   ============================================================ */

function findPhrases(words) {

    const matches = [];

    let i = 0;

    while (i < words.length) {

        let best = null;

        for (
            const phrase of COMMON_PHRASES
        ) {

            const parts =
                phrase.split(" ");

            if (
                i + parts.length >
                words.length
            ) {
                continue;
            }

            let same = true;

            for (
                let j = 0;
                j < parts.length;
                j++
            ) {

                if (
                    words[i + j] !==
                    parts[j]
                ) {
                    same = false;
                    break;
                }

            }

            if (
                same &&
                (
                    !best ||
                    parts.length >
                    best.parts.length
                )
            ) {

                best = {
                    text: phrase,
                    parts: parts,
                    start: i
                };

            }

        }

        if (best) {

            matches.push(best);

            i += best.parts.length;

        } else {

            i++;

        }

    }

    return matches;
}


/* ============================================================
   PHRASE CARD
   ============================================================ */

function createPhraseCard(
    phrase,
    dictionary,
    series
) {

    const card =
        document.createElement("div");

    card.className =
        "card phrase-card";

    const title =
        document.createElement("div");

    title.className =
        "phrase-title";

    title.textContent =
        phrase.text;

    card.appendChild(title);

    const note =
        document.createElement("div");

    note.className =
        "phrase-note";

    note.textContent =
        "Recognized phrase — individual Greggdict outlines shown below.";

    card.appendChild(note);

    const wordsContainer =
        document.createElement("div");

    wordsContainer.className =
        "phrase-words";

    for (
        const word of phrase.parts
    ) {

        const box =
            document.createElement("div");

        box.className =
            "mini-word";

        const label =
            document.createElement("div");

        label.className =
            "mini-word-title";

        label.textContent =
            word;

        box.appendChild(label);

        const mini =
            document.createElement("div");

        mini.className =
            "mini-outline";

        box.appendChild(mini);

        const entry =
            findWord(
                dictionary,
                word
            );

        if (entry) {

            renderMiniWord(
                mini,
                series,
                entry
            );

        } else {

            mini.innerHTML =
                '<div class="missing">' +
                'Not found' +
                '</div>';

        }

        wordsContainer.appendChild(box);

    }

    card.appendChild(wordsContainer);

    return card;
}


/* ============================================================
   MINI WORD RENDERER
   ============================================================ */

function renderMiniWord(
    container,
    series,
    entry
) {

    const img =
        document.createElement("img");

    img.src =
        dictionaryPageUrl(
            series,
            entry.page
        ) +
        "?cb=" +
        Date.now();

    img.onload = function () {

        const naturalWidth =
            img.naturalWidth || IMG_WIDTH;

        const scale =
            IMG_WIDTH / naturalWidth;

        img.style.width =
            IMG_WIDTH + "px";

        img.style.top =
            -(
                entry.y * scale -
                45
            ) + "px";

        img.style.left =
            -(
                entry.x * scale -
                5
            ) + "px";

    };

    container.appendChild(img);
}


/* ============================================================
   TRANSLATE
   ============================================================ */

async function translate() {

    const input =
        document
            .getElementById("inputText")
            .value
            .trim();

    const series =
        document
            .getElementById("series")
            .value;

    const results =
        document
            .getElementById("results");

    const status =
        document
            .getElementById("status");

    results.innerHTML = "";

    if (!input) {

        status.textContent =
            "Type something first.";

        return;
    }

    try {

        status.textContent =
            "Loading " +
            series +
            " dictionary...";

        const dictionary =
            await loadDictionary(series);

        const words =
            tokenize(input);

        const phrases =
            findPhrases(words);

        status.textContent =
            "Ready — " +
            series +
            " Greggdict";

        /*
         * Show phrase recognition first.
         */

        for (
            const phrase of phrases
        ) {

            results.appendChild(
                createPhraseCard(
                    phrase,
                    dictionary,
                    series
                )
            );

        }

        /*
         * Show all individual words.
         */

        for (
            const word of words
        ) {

            results.appendChild(
                createWordCard(
                    word,
                    dictionary,
                    series
                )
            );

        }

    } catch (error) {

        console.error(error);

        status.textContent =
            "Error loading Gregg dictionary.";

        results.innerHTML =
            '<div class="card">' +
            '<div class="missing">' +
            error.message +
            '</div>' +
            '</div>';

    }

}


/* ============================================================
   BUTTONS
   ============================================================ */

document
    .getElementById("translateBtn")
    .addEventListener(
        "click",
        translate
    );


document
    .getElementById("clearBtn")
    .addEventListener(
        "click",
        function () {

            document
                .getElementById("inputText")
                .value = "";

            document
                .getElementById("results")
                .innerHTML = "";

            document
                .getElementById("status")
                .textContent =
                    "Ready.";

        }
    );


/* Ctrl + Enter */

document
    .getElementById("inputText")
    .addEventListener(
        "keydown",
        function (event) {

            if (
                event.ctrlKey &&
                event.key === "Enter"
            ) {

                translate();

            }

        }
    );


/* Initial load */

loadDictionary("Anniversary")
    .then(() => {

        document
            .getElementById("status")
            .textContent =
                "Ready — Greggdict loaded.";

    })
    .catch(error => {

        console.error(error);

        document
            .getElementById("status")
            .textContent =
                "Could not load Greggdict.";

    });

</script>

</body>
</html>
