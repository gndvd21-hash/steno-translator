<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gregg Shorthand Translator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 16px;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

h1 {
    margin: 0 0 18px;
}

textarea {
    width: 100%;
    height: 120px;
    padding: 14px;
    font-size: 18px;
    border: 1px solid #999;
    border-radius: 8px;
    resize: vertical;
}

.controls {
    margin: 14px 0;
}

button {
    padding: 10px 18px;
    margin-right: 8px;
    border: 1px solid #aaa;
    border-radius: 7px;
    background: white;
    font-size: 15px;
    cursor: pointer;
}

button.active {
    background: #222;
    color: white;
}

#status {
    color: #777;
    margin: 8px 0 15px;
    font-size: 13px;
}

#results {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.card {
    width: 385px;
    max-width: 100%;
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 8px;
}

.label {
    font-weight: bold;
    text-align: center;
    margin-bottom: 5px;
    font-size: 16px;
}

.source {
    text-align: center;
    color: #888;
    font-size: 11px;
    margin-top: 4px;
}

.outline {
    width: 365px;
    max-width: 100%;
    height: 100px;
    margin: auto;
    position: relative;
    overflow: hidden;
    background: white;
}

.outline img {
    position: absolute;
    max-width: none;
}

.missing {
    width: 100%;
    height: 100px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #aaa;
    font-size: 13px;
    text-align: center;
    padding: 10px;
}

.loading {
    width: 100%;
    height: 100px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #888;
    font-size: 13px;
}
</style>
</head>

<body>

<h1>Gregg Shorthand Translator</h1>

<textarea
    id="input"
    placeholder="Type English text here..."
></textarea>

<div class="controls">

    <button id="anniversaryBtn" class="active">
        Anniversary
    </button>

    <button id="simplifiedBtn">
        Simplified
    </button>

</div>

<div id="status">
    Loading...
</div>

<div id="results"></div>


<script>

/* =========================================================
   PDF.JS
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   GREGGDICT
   THIS REMAINS OUR PRIMARY WORD SOURCE
========================================================= */

const GREGGDICT =
    "https://raw.githubusercontent.com/richyliu/greggdict/master/assets/";


/* =========================================================
   ANNIVERSARY PHRASE BOOK
========================================================= */

const PHRASE_BOOK =
    "https://greggshorthand.github.io/phrasebook.pdf";


/* =========================================================
   ORIGINAL GREGGDICT DISPLAY VALUES
========================================================= */

const IMG_WIDTH = 1281;
const DISPLAY_WIDTH = 365;
const DISPLAY_HEIGHT = 100;
const OFFSET = 5;


/* =========================================================
   STATE
========================================================= */

let currentSeries = "Anniversary";

let anniversaryDictionary = null;
let simplifiedDictionary = null;

let phraseBook = null;

let phrasePages = [];

let phraseIndex = new Map();

let phraseBookReady = false;


/* =========================================================
   NORMALIZATION
========================================================= */

function normalize(text) {

    return String(text)
        .toLowerCase()
        .replace(/[“”‘’]/g, "'")
        .replace(/[.,!?;:()[\]{}"“”]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}


function cleanWord(word) {

    return String(word)
        .toLowerCase()
        .replace(/^[^a-z]+/i, "")
        .replace(/[^a-z]+$/i, "");
}


/* =========================================================
   LOAD GREGGDICT
========================================================= */

async function loadDictionary(series) {

    const url =
        GREGGDICT +
        series +
        "/reference.json?cb=" +
        Date.now();

    const response =
        await fetch(url);

    if (!response.ok) {
        throw new Error(
            "Could not load " + series
        );
    }

    return await response.json();
}


/* =========================================================
   GREGGDICT WORD LOOKUP
========================================================= */

function findDictionaryWord(word) {

    const dictionary =
        currentSeries === "Anniversary"
            ? anniversaryDictionary
            : simplifiedDictionary;

    if (!dictionary) {
        return null;
    }

    const target =
        cleanWord(word);

    for (const page of dictionary) {

        if (!page.words) {
            continue;
        }

        for (const entry of page.words) {

            if (
                cleanWord(entry.t) ===
                target
            ) {

                return {
                    page: page.page,
                    x: entry.x,
                    y: entry.y,
                    term: entry.t
                };

            }
        }
    }

    return null;
}


/* =========================================================
   LOAD ANNIVERSARY PHRASE BOOK
========================================================= */

async function loadPhraseBook() {

    try {

        phraseBook =
            await pdfjsLib.getDocument({
                url: PHRASE_BOOK
            }).promise;

        console.log(
            "Phrase Book pages:",
            phraseBook.numPages
        );

        phraseBookReady = true;

        await buildPhraseIndex();

    } catch (error) {

        console.error(
            "Could not load Anniversary Phrase Book:",
            error
        );

        phraseBookReady = false;
    }
}


/* =========================================================
   EXTRACT ONE PDF PAGE
========================================================= */

async function extractPhrasePage(pageNumber) {

    if (phrasePages[pageNumber]) {
        return phrasePages[pageNumber];
    }

    const page =
        await phraseBook.getPage(pageNumber);

    const content =
        await page.getTextContent();

    const items =
        content.items
            .map(item => {

                const text =
                    (item.str || "").trim();

                return {
                    text: text,
                    normalized: normalize(text),
                    x: item.transform[4],
                    y: item.transform[5],
                    width: item.width || 0,
                    height: item.height || 0
                };

            })
            .filter(item => item.normalized);

    const result = {
        pageNumber: pageNumber,
        items: items
    };

    phrasePages[pageNumber] = result;

    return result;
}


/* =========================================================
   FIND PHRASE ON ONE PAGE
========================================================= */

function findPhraseOnPage(
    pageData,
    target
) {

    const targetWords =
        normalize(target)
            .split(" ")
            .filter(Boolean);

    const items =
        pageData.items;

    /*
       First try each PDF text item by itself.
       This catches entries where the entire phrase
       is stored as one text item.
    */

    for (let i = 0; i < items.length; i++) {

        if (
            items[i].normalized ===
            target
        ) {

            return {
                start: i,
                end: i,
                items: [items[i]]
            };

        }
    }


    /*
       Now try consecutive text items on the
       same approximate horizontal row.

       This catches phrases split into multiple
       PDF text objects.
    */

    for (let i = 0; i < items.length; i++) {

        let collected = "";

        const matched = [];

        let previous = null;

        for (
            let j = i;
            j < Math.min(i + targetWords.length + 4, items.length);
            j++
        ) {

            const item =
                items[j];

            /*
               Don't cross large vertical gaps.
            */

            if (
                previous &&
                Math.abs(
                    item.y - previous.y
                ) > 10
            ) {
                break;
            }

            /*
               Don't cross a large horizontal jump.
               This prevents accidentally joining the
               two columns of the Phrase Book.
            */

            if (
                previous &&
                item.x -
                (previous.x + previous.width)
                > 90
            ) {
                break;
            }

            collected =
                (
                    collected +
                    " " +
                    item.normalized
                )
                .replace(/\s+/g, " ")
                .trim();

            matched.push(item);

            if (
                collected ===
                target
            ) {

                return {
                    start: i,
                    end: j,
                    items: matched
                };

            }

            /*
               If the collected text can no longer
               begin with the target, stop.
            */

            if (
                !target.startsWith(
                    collected
                )
            ) {

                break;
            }

            previous = item;
        }
    }

    return null;
}


/* =========================================================
   BUILD PHRASE INDEX
========================================================= */

async function buildPhraseIndex() {

    if (!phraseBook) {
        return;
    }

    phraseIndex.clear();

    /*
       We do not attempt to create a fake dictionary.

       Instead, we index the actual text on every
       Phrase Book page. This allows the real scanned
       phrase image to be retrieved later.
    */

    for (
        let pageNumber = 1;
        pageNumber <= phraseBook.numPages;
        pageNumber++
    ) {

        const page =
            await extractPhrasePage(
                pageNumber
            );

        /*
           Store normalized text strings.

           This makes searching much faster after
           the first load.
        */

        const seen =
            new Set();

        for (const item of page.items) {

            if (
                item.normalized.length < 2
            ) {
                continue;
            }

            if (
                seen.has(
                    item.normalized
                )
            ) {
                continue;
            }

            seen.add(
                item.normalized
            );

            /*
               Single text items that contain multiple
               words are especially useful.
            */

            if (
                item.normalized.includes(" ")
            ) {

                if (
                    !phraseIndex.has(
                        item.normalized
                    )
                ) {

                    phraseIndex.set(
                        item.normalized,
                        {
                            page:
                                pageNumber,
                            mode:
                                "single",
                            item:
                                item
                        }
                    );

                }

            }

        }
    }

    console.log(
        "Phrase index:",
        phraseIndex.size,
        "entries"
    );
}


/* =========================================================
   SEARCH PHRASE BOOK
========================================================= */

async function findPhraseBookPhrase(
    phrase
) {

    if (
        !phraseBookReady ||
        !phraseBook
    ) {
        return null;
    }

    const target =
        normalize(phrase);

    /*
       Fast lookup.
    */

    if (
        phraseIndex.has(target)
    ) {

        return phraseIndex.get(target);

    }


    /*
       Full page search.

       This catches phrases that are split into
       multiple PDF text objects.
    */

    for (
        let pageNumber = 1;
        pageNumber <= phraseBook.numPages;
        pageNumber++
    ) {

        const page =
            await extractPhrasePage(
                pageNumber
            );

        const match =
            findPhraseOnPage(
                page,
                target
            );

        if (match) {

            return {
                page:
                    pageNumber,
                mode:
                    "sequence",
                match:
                    match
            };

        }
    }

    return null;
}


/* =========================================================
   RENDER PHRASE BOOK PAGE
========================================================= */

async function renderPhraseBookPhrase(
    phrase,
    result,
    container
) {

    if (!result) {

        showMissing(
            container,
            "Phrase not found"
        );

        return;
    }

    try {

        const page =
            await phraseBook.getPage(
                result.page
            );

        /*
           Render at 2x for better crop quality.
        */

        const scale = 2;

        const viewport =
            page.getViewport({
                scale: scale
            });

        const canvas =
            document.createElement(
                "canvas"
            );

        canvas.width =
            Math.ceil(
                viewport.width
            );

        canvas.height =
            Math.ceil(
                viewport.height
            );

        const context =
            canvas.getContext(
                "2d"
            );

        await page.render({
            canvasContext:
                context,
            viewport:
                viewport
        }).promise;


        /*
           Locate the phrase text.
        */

        let textItems = [];

        if (
            result.mode ===
            "single"
        ) {

            textItems = [
                result.item
            ];

        } else {

            textItems =
                result.match.items;

        }

        const left =
            Math.min(
                ...textItems.map(
                    x => x.x
                )
            );

        const right =
            Math.max(
                ...textItems.map(
                    x =>
                        x.x +
                        x.width
                )
            );

        const bottom =
            Math.min(
                ...textItems.map(
                    x => x.y
                )
            );

        const top =
            Math.max(
                ...textItems.map(
                    x =>
                        x.y +
                        x.height
                )
            );


        /*
           Phrase Book layout normally places the
           shorthand outline beside the printed phrase.

           We therefore take an area to the LEFT of
           the phrase label.

           We also allow a little extra width because
           some phrase outlines are long.
        */

        const phraseWidth =
            right - left;

        let cropWidth =
            Math.max(
                150,
                Math.min(
                    300,
                    phraseWidth * 1.8
                )
            );

        /*
           Position to the left of the printed phrase.
        */

        let sx =
            (left * scale) -
            (cropWidth * scale) -
            (12 * scale);

        /*
           Convert PDF bottom-origin Y coordinate
           to canvas top-origin coordinate.
        */

        const canvasPhraseTop =
            viewport.height -
            (top * scale);

        let sy =
            canvasPhraseTop -
            (12 * scale);

        let cropHeight =
            Math.max(
                55,
                Math.min(
                    95,
                    (top - bottom + 35)
                )
            ) * scale;


        /*
           If the phrase is near the left edge,
           expand the crop to the right of the
           phrase as a fallback.
        */

        if (sx < 0) {

            sx =
                left * scale;

            cropWidth =
                Math.min(
                    320 * scale,
                    viewport.width -
                    sx
                );

        }


        /*
           Clamp crop.
        */

        sx =
            Math.max(
                0,
                Math.min(
                    sx,
                    viewport.width -
                    cropWidth
                )
            );

        sy =
            Math.max(
                0,
                Math.min(
                    sy,
                    viewport.height -
                    cropHeight
                )
            );


        /*
           Create crop canvas.
        */

        const cropCanvas =
            document.createElement(
                "canvas"
            );

        cropCanvas.width =
            Math.ceil(
                cropWidth
            );

        cropCanvas.height =
            Math.ceil(
                cropHeight
            );

        const cropContext =
            cropCanvas.getContext(
                "2d"
            );

        cropContext.fillStyle =
            "white";

        cropContext.fillRect(
            0,
            0,
            cropCanvas.width,
            cropCanvas.height
        );

        cropContext.drawImage(
            canvas,
            sx,
            sy,
            cropWidth,
            cropHeight,
            0,
            0,
            cropWidth,
            cropHeight
        );


        /*
           Display crop.
        */

        const img =
            document.createElement(
                "img"
            );

        img.src =
            cropCanvas.toDataURL(
                "image/png"
            );

        img.style.position =
            "absolute";

        img.style.left =
            "0";

        img.style.top =
            "0";

        img.style.width =
            "365px";

        img.style.height =
            "100px";

        img.style.objectFit =
            "contain";

        container.innerHTML = "";

        container.appendChild(
            img
        );


    } catch (error) {

        console.error(
            "Phrase rendering error:",
            error
        );

        showMissing(
            container,
            "Could not render phrase"
        );

    }
}


/* =========================================================
   RENDER GREGGDICT WORD
   ORIGINAL WORKING METHOD PRESERVED
========================================================= */

function renderDictionaryWord(
    entry,
    container
) {

    if (!entry) {

        showMissing(
            container,
            "Not found"
        );

        return;
    }

    const img =
        document.createElement(
            "img"
        );

    img.src =
        GREGGDICT +
        currentSeries +
        "/pages/" +
        String(entry.page)
            .padStart(3, "0") +
        ".png?cb=" +
        Date.now();


    img.onload = function() {

        const scale =
            IMG_WIDTH /
            img.naturalWidth;

        img.style.width =
            IMG_WIDTH + "px";

        img.style.left =
            -(
                entry.x * scale -
                OFFSET
            ) + "px";

        img.style.top =
            -(
                entry.y * scale -
                DISPLAY_HEIGHT / 2
            ) + "px";

    };


    container.innerHTML = "";

    container.appendChild(
        img
    );
}


/* =========================================================
   MISSING
========================================================= */

function showMissing(
    container,
    message
) {

    container.innerHTML =
        `<div class="missing">
            ${escapeHTML(message)}
         </div>`;
}


/* =========================================================
   LOADING
========================================================= */

function showLoading(
    container
) {

    container.innerHTML =
        `<div class="loading">
            Looking up...
         </div>`;
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   CREATE CARD
========================================================= */

function createCard(
    text,
    source
) {

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "card";

    card.innerHTML = `
        <div class="label">
            ${escapeHTML(text)}
        </div>

        <div class="outline"></div>

        <div class="source">
            ${escapeHTML(source)}
        </div>
    `;

    return card;
}


/* =========================================================
   FIND BEST PHRASE
========================================================= */

async function findBestPhrase(
    words,
    start
) {

    if (
        currentSeries !==
        "Anniversary"
    ) {
        return null;
    }

    /*
       Longest first.
       8 → 7 → 6 → ... → 2 words
    */

    const max =
        Math.min(
            8,
            words.length -
            start
        );

    for (
        let count = max;
        count >= 2;
        count--
    ) {

        const candidate =
            words
                .slice(
                    start,
                    start + count
                )
                .join(" ");

        const result =
            await findPhraseBookPhrase(
                candidate
            );

        if (result) {

            return {
                text:
                    candidate,
                count:
                    count,
                result:
                    result
            };

        }

    }

    return null;
}


/* =========================================================
   TRANSLATE
========================================================= */

let translationNumber = 0;

async function translate() {

    const myRun =
        ++translationNumber;

    const input =
        document
            .getElementById(
                "input"
            )
            .value;

    const results =
        document
            .getElementById(
                "results"
            );

    results.innerHTML = "";

    const normalized =
        normalize(input);

    if (!normalized) {
        return;
    }

    const words =
        normalized.split(" ");

    let index = 0;


    while (
        index < words.length
    ) {

        /*
           Ignore stale translation runs.
        */

        if (
            myRun !==
            translationNumber
        ) {
            return;
        }


        /* ---------------------------------------------
           PHRASE FIRST
        --------------------------------------------- */

        const phrase =
            await findBestPhrase(
                words,
                index
            );

        if (phrase) {

            const card =
                createCard(
                    phrase.text,
                    "Anniversary Phrase Book"
                );

            results.appendChild(
                card
            );

            const outline =
                card.querySelector(
                    ".outline"
                );

            showLoading(
                outline
            );

            await renderPhraseBookPhrase(
                phrase.text,
                phrase.result,
                outline
            );

            index +=
                phrase.count;

            continue;
        }


        /* ---------------------------------------------
           INDIVIDUAL WORD
        --------------------------------------------- */

        const word =
            words[index];

        const card =
            createCard(
                word,
                currentSeries +
                " dictionary"
            );

        results.appendChild(
            card
        );

        const outline =
            card.querySelector(
                ".outline"
            );

        const entry =
            findDictionaryWord(
                word
            );

        renderDictionaryWord(
            entry,
            outline
        );

        index++;

    }

}


/* =========================================================
   SERIES BUTTONS
========================================================= */

document
    .getElementById(
        "anniversaryBtn"
    )
    .addEventListener(
        "click",
        async function() {

            currentSeries =
                "Anniversary";

            this.classList.add(
                "active"
            );

            document
                .getElementById(
                    "simplifiedBtn"
                )
                .classList.remove(
                    "active"
                );

            await translate();

        }
    );


document
    .getElementById(
        "simplifiedBtn"
    )
    .addEventListener(
        "click",
        async function() {

            currentSeries =
                "Simplified";

            this.classList.add(
                "active"
            );

            document
                .getElementById(
                    "anniversaryBtn"
                )
                .classList.remove(
                    "active"
                );

            await translate();

        }
    );


/* =========================================================
   LIVE INPUT
========================================================= */

let typingTimer = null;

document
    .getElementById(
        "input"
    )
    .addEventListener(
        "input",
        function() {

            clearTimeout(
                typingTimer
            );

            typingTimer =
                setTimeout(
                    translate,
                    500
                );

        }
    );


/* =========================================================
   INITIALIZATION
========================================================= */

(async function() {

    const status =
        document.getElementById(
            "status"
        );

    try {

        status.textContent =
            "Loading Greggdict...";

        /*
           KEEPING OUR ORIGINAL SOURCE.
        */

        anniversaryDictionary =
            await loadDictionary(
                "Anniversary"
            );

        simplifiedDictionary =
            await loadDictionary(
                "Simplified"
            );


        status.textContent =
            "Loading Anniversary Phrase Book...";


        await loadPhraseBook();


        if (
            phraseBookReady
        ) {

            status.textContent =
                "Ready — Greggdict + Anniversary Phrase Book";

        } else {

            status.textContent =
                "Ready — Greggdict only";

        }


    } catch (error) {

        console.error(error);

        status.textContent =
            "Dictionary loading error.";

    }

})();

</script>

</body>
</html>
