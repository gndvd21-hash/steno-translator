<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gregg Shorthand Translator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
        type="module"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 25px;
}

h1 {
    margin: 0 0 4px;
}

.subtitle {
    color: #666;
    margin-bottom: 20px;
}

textarea {
    width: 100%;
    min-height: 120px;
    padding: 15px;
    font-size: 18px;
    border: 1px solid #ccc;
    border-radius: 10px;
    resize: vertical;
}

.controls {
    display: flex;
    gap: 10px;
    margin: 15px 0;
    align-items: center;
    flex-wrap: wrap;
}

select,
button {
    padding: 10px 14px;
    font-size: 15px;
    border: 1px solid #bbb;
    border-radius: 8px;
    background: white;
    cursor: pointer;
}

button:hover {
    background: #eee;
}

#status {
    color: #666;
    margin: 10px 0 15px;
}

.results {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 15px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    overflow: hidden;
}

.title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 4px;
}

.source {
    font-size: 12px;
    color: #888;
    margin-bottom: 10px;
}

.outline {
    width: 100%;
    height: 150px;
    overflow: hidden;
    position: relative;
    background: white;
}

.outline img {
    position: absolute;
    max-width: none;
}

.missing {
    color: #999;
    font-style: italic;
    padding: 30px 5px;
    text-align: center;
}

.pdf-card {
    grid-column: 1 / -1;
    background: #fffdf1;
    border: 1px solid #e5d98c;
}

.pdf-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 4px;
}

.pdf-info {
    color: #777;
    font-size: 13px;
    margin-bottom: 12px;
}

.pdf-crop {
    width: 100%;
    min-height: 220px;
    overflow: auto;
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    text-align: center;
}

.pdf-crop canvas {
    max-width: 100%;
    height: auto;
}

.pdf-failed {
    padding: 25px;
    color: #999;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

<h1>Gregg Shorthand Translator</h1>

<div class="subtitle">
English → Gregg Shorthand
</div>

<textarea id="inputText"
placeholder="Try: dear sir i am ready"></textarea>

<div class="controls">

<label>
Series:
<select id="series">
<option value="Anniversary">Anniversary</option>
<option value="Simplified">Simplified</option>
</select>
</label>

<button id="translateBtn">Translate</button>

<button id="clearBtn">Clear</button>

</div>

<div id="status">
Loading...
</div>

<div id="results" class="results"></div>

</div>


<script type="module">

/* =========================================================
   PDF.JS
   ========================================================= */

import * as pdfjsLib
from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


/* =========================================================
   SOURCES
   ========================================================= */

const GREGG_BASE =
    "https://raw.githubusercontent.com/richyliu/greggdict/master/assets/";

const MANUAL_PDF =
    "./Gregg%20Shorthand%20Manual%20(1929)%20(1).pdf";


/* =========================================================
   GREGGDICT SETTINGS
   ========================================================= */

const IMG_WIDTH = 1281;

const DISPLAY_SIZE = {
    x: 365,
    y: 100,
    offset: 5
};


/* =========================================================
   DATA
   ========================================================= */

let dictionary = [];

let pdfDocument = null;


/* =========================================================
   LOAD GREGGDICT
   ========================================================= */

async function loadDictionary(series) {

    const url =
        GREGG_BASE +
        series +
        "/reference.json?cb=" +
        Date.now();

    const response =
        await fetch(url);

    if (!response.ok) {
        throw new Error(
            "Could not load Greggdict."
        );
    }

    dictionary =
        await response.json();

    return dictionary;
}


/* =========================================================
   FIND WORD IN GREGGDICT
   ========================================================= */

function findWord(word) {

    const target =
        word.toLowerCase();

    for (const page of dictionary) {

        if (!page.words) continue;

        for (const item of page.words) {

            if (!item.t) continue;

            if (
                item.t.toLowerCase() ===
                target
            ) {

                return {
                    page: page.page,
                    x: Number(item.x),
                    y: Number(item.y)
                };

            }

        }

    }

    return null;
}


/* =========================================================
   GREGGDICT PAGE
   ========================================================= */

function greggPage(series, page) {

    return (
        GREGG_BASE +
        series +
        "/pages/" +
        String(page).padStart(3, "0") +
        ".png"
    );
}


/* =========================================================
   RENDER GREGGDICT WORD
   ========================================================= */

function renderGreggWord(
    container,
    series,
    entry
) {

    const img =
        document.createElement("img");

    img.src =
        greggPage(
            series,
            entry.page
        );

    img.onload = function() {

        const scale =
            IMG_WIDTH /
            img.naturalWidth;

        img.style.width =
            IMG_WIDTH + "px";

        img.style.top =
            -(
                entry.y * scale -
                DISPLAY_SIZE.y / 2
            ) + "px";

        img.style.left =
            -(
                entry.x * scale -
                DISPLAY_SIZE.offset
            ) + "px";
    };

    container.appendChild(img);
}


/* =========================================================
   WORD CARD
   ========================================================= */

function createWordCard(
    word,
    series
) {

    const card =
        document.createElement("div");

    card.className =
        "card";

    const title =
        document.createElement("div");

    title.className =
        "title";

    title.textContent =
        word;

    card.appendChild(title);

    const source =
        document.createElement("div");

    source.className =
        "source";

    source.textContent =
        series + " — Greggdict";

    card.appendChild(source);

    const outline =
        document.createElement("div");

    outline.className =
        "outline";

    card.appendChild(outline);

    const entry =
        findWord(word);

    if (!entry) {

        outline.innerHTML =
            '<div class="missing">' +
            'No Greggdict entry' +
            '</div>';

    } else {

        renderGreggWord(
            outline,
            series,
            entry
        );

    }

    return card;
}


/* =========================================================
   NORMALIZE TEXT
   ========================================================= */

function normalizeText(text) {

    return text
        .toLowerCase()
        .replace(/[“”‘’]/g, "'")
        .replace(/\s+/g, " ")
        .trim();
}


/* =========================================================
   LOAD PDF
   ========================================================= */

async function loadManual() {

    if (pdfDocument) {
        return pdfDocument;
    }

    document.getElementById("status").textContent =
        "Loading 1929 Gregg Shorthand Manual...";

    pdfDocument =
        await pdfjsLib.getDocument(
            MANUAL_PDF
        ).promise;

    return pdfDocument;
}


/* =========================================================
   SEARCH PDF
   THIS IS OUR PROGRAMMATIC CTRL+F
   ========================================================= */

async function searchPDF(searchText) {

    const pdf =
        await loadManual();

    const wanted =
        normalizeText(searchText);

    const matches = [];

    for (
        let pageNumber = 1;
        pageNumber <= pdf.numPages;
        pageNumber++
    ) {

        const page =
            await pdf.getPage(
                pageNumber
            );

        const textContent =
            await page.getTextContent();

        const items =
            textContent.items || [];

        for (
            let i = 0;
            i < items.length;
            i++
        ) {

            const item =
                items[i];

            if (!item.str) continue;

            const current =
                normalizeText(
                    item.str
                );

            /* Exact match inside a PDF text item */

            if (
                current === wanted ||
                current.includes(wanted)
            ) {

                matches.push({
                    page: pageNumber,
                    item: item,
                    text: item.str,
                    index: i
                });

            }

            /*
             * Some PDF text is split into several
             * separate text objects.
             *
             * Example:
             * "Dear" + "Sir"
             */

            let combined = current;

            let end = i;

            while (
                end + 1 < items.length &&
                combined.length < wanted.length + 30
            ) {

                const next =
                    normalizeText(
                        items[end + 1].str || ""
                    );

                if (!next) {
                    end++;
                    continue;
                }

                combined +=
                    " " + next;

                end++;

                if (
                    combined.includes(
                        wanted
                    )
                ) {

                    matches.push({
                        page: pageNumber,
                        item: item,
                        item2: items[end],
                        text: combined,
                        index: i
                    });

                    break;
                }
            }
        }
    }

    return matches;
}


/* =========================================================
   RENDER PDF MATCH
   ========================================================= */

async function renderPDFMatch(
    container,
    match
) {

    const pdf =
        pdfDocument;

    const page =
        await pdf.getPage(
            match.page
        );

    const viewport =
        page.getViewport({
            scale: 2
        });

    /*
     * PDF text item coordinates.
     */

    const transform =
        viewport.transform;

    const item =
        match.item;

    const tx =
        item.transform;

    /*
     * Convert PDF coordinates
     * into canvas coordinates.
     */

    const pdfX =
        tx[4];

    const pdfY =
        tx[5];

    const point =
        viewport.convertToViewportPoint(
            pdfX,
            pdfY
        );

    let x =
        point[0];

    let y =
        point[1];

    /*
     * The important trick:
     *
     * We don't blindly crop one tiny box.
     *
     * We make a larger region around
     * the exact Ctrl+F match so the
     * actual shorthand printed around
     * the entry remains visible.
     */

    const cropWidth = 330;
    const cropHeight = 180;

    let cropX =
        x - 100;

    let cropY =
        y - 80;

    cropX =
        Math.max(
            0,
            Math.min(
                cropX,
                viewport.width -
                cropWidth
            )
        );

    cropY =
        Math.max(
            0,
            Math.min(
                cropY,
                viewport.height -
                cropHeight
            )
        );

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        cropWidth;

    canvas.height =
        cropHeight;

    const ctx =
        canvas.getContext(
            "2d"
        );

    /*
     * Render the complete PDF page
     * temporarily.
     */

    const fullCanvas =
        document.createElement(
            "canvas"
        );

    fullCanvas.width =
        Math.ceil(
            viewport.width
        );

    fullCanvas.height =
        Math.ceil(
            viewport.height
        );

    await page.render({
        canvasContext:
            fullCanvas.getContext("2d"),
        viewport:
            viewport
    }).promise;

    /*
     * Extract the region around
     * the exact search result.
     */

    ctx.drawImage(
        fullCanvas,
        cropX,
        cropY,
        cropWidth,
        cropHeight,
        0,
        0,
        cropWidth,
        cropHeight
    );

    container.innerHTML = "";

    container.appendChild(
        canvas
    );
}


/* =========================================================
   PDF RESULT CARD
   ========================================================= */

async function createPDFCard(
    phrase
) {

    const card =
        document.createElement("div");

    card.className =
        "card pdf-card";

    const title =
        document.createElement("div");

    title.className =
        "pdf-title";

    title.textContent =
        phrase;

    card.appendChild(title);

    const info =
        document.createElement("div");

    info.className =
        "pdf-info";

    info.textContent =
        "Searching the 1929 Gregg Shorthand Manual — programmatic Ctrl+F";

    card.appendChild(info);

    const crop =
        document.createElement("div");

    crop.className =
        "pdf-crop";

    crop.innerHTML =
        '<div class="pdf-failed">' +
        'Searching PDF...' +
        '</div>';

    card.appendChild(crop);

    try {

        const matches =
            await searchPDF(
                phrase
            );

        if (
            matches.length === 0
        ) {

            crop.innerHTML =
                '<div class="pdf-failed">' +
                'No exact PDF text match found.' +
                '</div>';

            return card;
        }

        const match =
            matches[0];

        info.textContent =
            "Found in PDF page " +
            match.page +
            " — searching by PDF text coordinates";

        await renderPDFMatch(
            crop,
            match
        );

    } catch(error) {

        console.error(error);

        crop.innerHTML =
            '<div class="pdf-failed">' +
            'PDF search failed: ' +
            error.message +
            '</div>';
    }

    return card;
}


/* =========================================================
   TRANSLATE
   ========================================================= */

async function translate() {

    const input =
        document
            .getElementById(
                "inputText"
            )
            .value
            .trim();

    const series =
        document
            .getElementById(
                "series"
            )
            .value;

    const results =
        document
            .getElementById(
                "results"
            );

    const status =
        document
            .getElementById(
                "status"
            );

    results.innerHTML = "";

    if (!input) {

        status.textContent =
            "Type something first.";

        return;
    }

    try {

        /*
         * Load Greggdict first.
         */

        await loadDictionary(
            series
        );

        /*
         * Load PDF in parallel.
         */

        await loadManual();

        status.textContent =
            "Searching Greggdict + PDF...";

        /*
         * Clean words.
         */

        const words =
            input
                .toLowerCase()
                .split(/\s+/)
                .map(
                    w =>
                        w.replace(
                            /[^a-z']/g,
                            ""
                        )
                )
                .filter(Boolean);

        /*
         * Show PDF searches for phrases.
         *
         * Start with phrases of 2+ words.
         */

        for (
            let i = 0;
            i < words.length - 1;
            i++
        ) {

            const phrase =
                words[i] +
                " " +
                words[i + 1];

            /*
             * Only try the PDF when
             * it looks like an actual phrase.
             */

            const card =
                await createPDFCard(
                    phrase
                );

            /*
             * Only add the card if
             * PDF actually found it.
             */

            const failed =
                card.querySelector(
                    ".pdf-failed"
                );

            if (!failed) {

                results.appendChild(
                    card
                );

            }
        }

        /*
         * Then Greggdict words.
         */

        for (
            const word of words
        ) {

            results.appendChild(
                createWordCard(
                    word,
                    series
                )
            );

        }

        status.textContent =
            "Ready — Greggdict + PDF search";

    } catch(error) {

        console.error(error);

        status.textContent =
            "Error: " +
            error.message;
    }
}


/* =========================================================
   BUTTONS
   ========================================================= */

document
    .getElementById(
        "translateBtn"
    )
    .addEventListener(
        "click",
        translate
    );


document
    .getElementById(
        "clearBtn"
    )
    .addEventListener(
        "click",
        () => {

            document
                .getElementById(
                    "inputText"
                )
                .value = "";

            document
                .getElementById(
                    "results"
                )
                .innerHTML = "";

            document
                .getElementById(
                    "status"
                )
                .textContent =
                    "Ready.";

        }
    );


/* =========================================================
   START
   ========================================================= */

(async function() {

    try {

        await loadDictionary(
            "Anniversary"
        );

        document
            .getElementById(
                "status"
            )
            .textContent =
                "Ready.";

    } catch(error) {

        console.error(error);

        document
            .getElementById(
                "status"
            )
            .textContent =
                "Ready — PDF/Greggdict will load when used.";

    }

})();

</script>

</body>
</html>
