<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gregg Shorthand Converter</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 25px;
}

h1 {
    text-align: center;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px 0;
}

button {
    padding: 10px 18px;
    border: 1px solid #aaa;
    border-radius: 8px;
    background: white;
    cursor: pointer;
    font-size: 15px;
}

button.active {
    background: #222;
    color: white;
}

textarea {
    width: 100%;
    min-height: 130px;
    padding: 15px;
    font-size: 18px;
    border: 1px solid #bbb;
    border-radius: 10px;
    resize: vertical;
}

.output-title {
    margin-top: 25px;
    margin-bottom: 10px;
    font-size: 20px;
    font-weight: bold;
}

#output {
    background: white;
    border-radius: 10px;
    padding: 20px;
    min-height: 150px;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 12px;
}

.word-container {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.word-label {
    font-size: 12px;
    color: #777;
    margin-bottom: 4px;
}

/*
    EXACTLY like Richy Liu's small ImageDisplay:

    width  = 365px
    height = 100px
    offset = 5px
*/

.gregg-box {
    width: 365px;
    height: 100px;
    position: relative;
    overflow: hidden;
    border: 1px solid #000;
    background: white;
}

.gregg-page {
    position: absolute;
    max-width: none;
    height: auto;
    visibility: hidden;
}

.unknown {
    height: 100px;
    min-width: 100px;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 1px dashed #aaa;
    color: #888;
}

.status {
    width: 100%;
    text-align: center;
    color: #777;
}

.error {
    color: #b00020;
}

</style>
</head>

<body>

<div class="container">

<h1>Gregg Shorthand Converter</h1>

<div class="controls">

<button id="anniversaryBtn" class="active">
Gregg Anniversary
</button>

<button id="simplifiedBtn">
Gregg Simplified
</button>

</div>

<textarea
id="inputText"
placeholder="Type English text here...

Example:
The sister will tell him."
></textarea>

<div class="output-title">
Gregg Outlines
</div>

<div id="output">

<div class="status">
Type something above.
</div>

</div>

</div>


<script>

/*
=========================================================
DICTIONARY SOURCES
=========================================================
*/

const REPO_BASE =
"https://raw.githubusercontent.com/richyliu/greggdict/master/assets/";

const dictionaries = {

    Anniversary: {

        reference:
        REPO_BASE + "Anniversary/reference.json",

        pages:
        REPO_BASE + "Anniversary/pages/"

    },

    Simplified: {

        reference:
        REPO_BASE + "Simplified/reference.json",

        pages:
        REPO_BASE + "Simplified/pages/"

    }

};


let currentDictionary = "Anniversary";

let dictionary = {};

let loadingDictionary = false;


/*
=========================================================
PHRASE BRAIN
=========================================================

IMPORTANT:

This is ONLY the recognition layer for now.

The actual Greggdict word renderer remains untouched.

We use longest-match-first so:

"I am ready"

becomes:

"I am" + "ready"

instead of:

"I" + "am" + "ready".
*/


const phraseDatabase = [

    "as a matter of fact",
    "as soon as possible",
    "at the same time",
    "in other words",
    "once in a while",
    "in my opinion",
    "in the first place",
    "in due course",

    "we shall not",
    "we shall be",
    "we have been",
    "we have not",
    "we are not",
    "we will not",

    "we shall",
    "we have",
    "we will",
    "we are",
    "we can",
    "we cannot",

    "you can",
    "he was",
    "to you",
    "at the",
    "is the",
    "of the",
    "and the",
    "will be",
    "to the",
    "that the",
    "of you",
    "it is",
    "by the",
    "it was",
    "i am",
    "to me",
    "to my",
    "at once",

    "dear sir"
];


/*
=========================================================
PREPARE PHRASES
=========================================================
*/

const normalizedPhrases =
phraseDatabase
    .map(p => p.toLowerCase().trim().split(/\s+/))
    .sort((a, b) => b.length - a.length);


/*
=========================================================
LOAD DICTIONARY
=========================================================
*/

async function loadDictionary(type) {

    loadingDictionary = true;

    showStatus(
        "Loading " + type + " dictionary..."
    );

    try {

        const response =
        await fetch(
            dictionaries[type].reference
        );

        if (!response.ok) {

            throw new Error(
                "Dictionary could not be loaded."
            );

        }

        const data =
        await response.json();

        dictionary = {};


        /*
        Build exact word lookup.
        */

        data.forEach(pageData => {

            pageData.words.forEach(entry => {

                const key =
                entry.t
                    .toLowerCase()
                    .trim();

                dictionary[key] = {

                    word: entry.t,

                    page: pageData.page,

                    x: entry.x,

                    y: entry.y

                };

            });

        });


        currentDictionary = type;

        loadingDictionary = false;

        renderText();

    }

    catch(error) {

        console.error(error);

        loadingDictionary = false;

        showStatus(
            "Could not load dictionary.",
            true
        );

    }

}


/*
=========================================================
STATUS
=========================================================
*/

function showStatus(message, error = false) {

    document.getElementById("output").innerHTML =

    `<div class="status ${error ? "error" : ""}">
        ${message}
    </div>`;

}


/*
=========================================================
CREATE GREGG IMAGE
=========================================================
*/

function createGreggImage(entry) {

    const box =
    document.createElement("div");

    box.className =
    "gregg-box";


    const image =
    document.createElement("img");

    image.className =
    "gregg-page";


    /*
    EXACT PAGE IMAGE FROM RICHY LIU
    */

    image.src =

        dictionaries[currentDictionary].pages +

        entry.page +

        ".png";


    /*
    Cache breaker
    */

    image.src +=
        "?cachebreaker=" +
        encodeURIComponent(
            entry.word + entry.y
        );


    /*
    Richy Liu positioning
    */

    image.onload = function() {

        const IMG_WIDTH = 1281;

        const DISPLAY_WIDTH = 365;

        const DISPLAY_HEIGHT = 100;

        const OFFSET = 5;


        const scale =
            IMG_WIDTH /
            image.naturalWidth;


        image.style.width =
            IMG_WIDTH + "px";


        image.style.left =

            -(entry.x * scale - OFFSET)
            + "px";


        image.style.top =

            -(entry.y * scale -
            DISPLAY_HEIGHT / 2)
            + "px";


        image.style.visibility =
            "visible";

    };


    image.onerror = function() {

        box.innerHTML =
        `<div class="unknown">
            Image unavailable
        </div>`;

    };


    box.appendChild(image);

    return box;

}


/*
=========================================================
CREATE WORD
=========================================================
*/

function createWordElement(word) {

    const wrapper =
    document.createElement("div");

    wrapper.className =
    "word-container";


    const label =
    document.createElement("div");

    label.className =
    "word-label";

    label.textContent =
        word;


    wrapper.appendChild(label);


    /*
    EXACT LOOKUP
    */

    const key =
        word.toLowerCase().trim();


    const entry =
        dictionary[key];


    if (!entry) {

        const unknown =
        document.createElement("div");

        unknown.className =
            "unknown";

        unknown.textContent =
            "No outline";

        wrapper.appendChild(
            unknown
        );

        return wrapper;

    }


    const image =
        createGreggImage(entry);


    wrapper.appendChild(image);


    return wrapper;

}


/*
=========================================================
CREATE PHRASE PLACEHOLDER
=========================================================

For this first test, we DO NOT invent a shorthand image.

We simply prove that the parser recognized the phrase.

Once the parser is confirmed, this function will be
replaced by the REAL phrase-image renderer.
=========================================================
*/

function createPhraseElement(phrase) {

    const wrapper =
    document.createElement("div");

    wrapper.className =
    "word-container";


    const label =
    document.createElement("div");

    label.className =
    "word-label";

    label.textContent =
        phrase;


    wrapper.appendChild(label);


    const unknown =
    document.createElement("div");

    unknown.className =
        "unknown";

    unknown.textContent =
        "Phrase recognized";

    wrapper.appendChild(unknown);


    return wrapper;

}


/*
=========================================================
PHRASE PARSER
=========================================================

Returns:

[
    {
        type: "phrase",
        text: "i am"
    },

    {
        type: "word",
        text: "ready"
    }
]

Longest phrase wins.
=========================================================
*/

function parseIntoPhrases(text) {

    const rawWords =
        text
            .trim()
            .split(/\s+/);


    const tokens = [];

    let i = 0;


    while (i < rawWords.length) {

        let matched = null;


        /*
        Try every known phrase,
        longest first.
        */

        for (const phraseWords of normalizedPhrases) {

            const length =
                phraseWords.length;


            if (
                i + length >
                rawWords.length
            ) {
                continue;
            }


            let matches = true;


            for (
                let j = 0;
                j < length;
                j++
            ) {

                const clean =
                    rawWords[i + j]
                        .replace(
                            /^[^a-zA-Z]+|[^a-zA-Z]+$/g,
                            ""
                        )
                        .toLowerCase();


                if (
                    clean !==
                    phraseWords[j]
                ) {

                    matches = false;

                    break;

                }

            }


            if (matches) {

                matched =
                    phraseWords.join(" ");

                break;

            }

        }


        if (matched) {

            tokens.push({

                type: "phrase",

                text: matched

            });


            i +=
                matched.split(" ").length;

        }

        else {

            const clean =
                rawWords[i]
                    .replace(
                        /^[^a-zA-Z]+|[^a-zA-Z]+$/g,
                        ""
                    );


            if (clean) {

                tokens.push({

                    type: "word",

                    text: clean

                });

            }


            i++;

        }

    }


    return tokens;

}


/*
=========================================================
RENDER TEXT
=========================================================
*/

function renderText() {

    const input =
    document.getElementById(
        "inputText"
    );


    const output =
    document.getElementById(
        "output"
    );


    const text =
        input.value.trim();


    if (!text) {

        output.innerHTML =

        `<div class="status">
            Type something above.
        </div>`;

        return;

    }


    if (
        !dictionary ||
        Object.keys(dictionary).length === 0
    ) {

        showStatus(
            "Dictionary is loading..."
        );

        return;

    }


    output.innerHTML = "";


    /*
    =====================================================
    NEW BRAIN
    =====================================================

    Instead of immediately doing:

        text.split(/\s+/)

    we first ask:

        "Is this part of the sentence a known phrase?"

    If yes:
        phrase

    If no:
        normal Greggdict word
    */

    const tokens =
        parseIntoPhrases(text);


    tokens.forEach(token => {


        if (token.type === "phrase") {

            /*
            TEMPORARY:

            This proves that the phrase parser
            correctly detected the phrase.

            Later this becomes the REAL
            phrase outline renderer.
            */

            const element =
                createPhraseElement(
                    token.text
                );


            output.appendChild(
                element
            );

        }

        else {

            const element =
                createWordElement(
                    token.text
                );


            output.appendChild(
                element
            );

        }

    });

}


/*
=========================================================
BUTTONS
=========================================================
*/

document
.getElementById("anniversaryBtn")
.addEventListener(
    "click",
    async () => {

        document
        .getElementById(
            "anniversaryBtn"
        )
        .classList.add("active");


        document
        .getElementById(
            "simplifiedBtn"
        )
        .classList.remove("active");


        await loadDictionary(
            "Anniversary"
        );

    }
);


document
.getElementById("simplifiedBtn")
.addEventListener(
    "click",
    async () => {

        document
        .getElementById(
            "simplifiedBtn"
        )
        .classList.add("active");


        document
        .getElementById(
            "anniversaryBtn"
        )
        .classList.remove("active");


        await loadDictionary(
            "Simplified"
        );

    }
);


/*
=========================================================
LIVE INPUT
=========================================================
*/

document
.getElementById("inputText")
.addEventListener(
    "input",
    renderText
);


/*
=========================================================
START
=========================================================
*/

loadDictionary(
    "Anniversary"
);

</script>

</body>
</html>
