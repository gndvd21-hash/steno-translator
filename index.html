<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gregg Shorthand Converter</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
        type="module"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        color: #222;
    }

    .container {
        max-width: 1200px;
        margin: 30px auto;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    .switch {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 20px;
    }

    button {
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #ddd;
        font-weight: bold;
    }

    button.active {
        background: #222;
        color: white;
    }

    textarea {
        width: 100%;
        height: 130px;
        padding: 15px;
        font-size: 18px;
        border: 1px solid #ccc;
        border-radius: 10px;
        resize: vertical;
    }

    .results {
        margin-top: 25px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .word-row {
        display: grid;
        grid-template-columns: 220px 1fr;
        align-items: center;
        background: white;
        border-radius: 10px;
        padding: 12px;
        box-shadow: 0 2px 6px rgba(0,0,0,.08);
    }

    .english {
        font-size: 18px;
        font-weight: bold;
    }

    .source {
        font-size: 11px;
        color: #777;
        margin-top: 4px;
    }

    .outline-box {
        width: 365px;
        height: 100px;
        overflow: hidden;
        position: relative;
        background: white;
    }

    .outline-box img {
        position: absolute;
        width: 1281px;
        max-width: none;
    }

    .book-canvas {
        width: 365px;
        height: 100px;
        object-fit: contain;
        background: white;
    }

    .missing {
        color: #999;
        font-style: italic;
    }

    @media(max-width:700px) {
        .word-row {
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .outline-box,
        .book-canvas {
            max-width: 100%;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>Gregg Shorthand Converter</h1>

    <div class="switch">
        <button id="anniversaryBtn" class="active">Anniversary</button>
        <button id="simplifiedBtn">Simplified</button>
    </div>

    <textarea id="input"
        placeholder="Type an English sentence here..."></textarea>

    <div id="results" class="results"></div>

</div>

<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


/* =========================================================
   GREGG DICTIONARY
   ========================================================= */

const DICTIONARY_URLS = {
    Anniversary:
        "https://raw.githubusercontent.com/richyliu/greggdict/master/assets/Anniversary/reference.json",

    Simplified:
        "https://raw.githubusercontent.com/richyliu/greggdict/master/assets/Simplified/reference.json"
};

const PAGE_BASE = {
    Anniversary:
        "https://raw.githubusercontent.com/richyliu/greggdict/master/assets/Anniversary/pages/",

    Simplified:
        "https://raw.githubusercontent.com/richyliu/greggdict/master/assets/Simplified/pages/"
};

let currentEdition = "Anniversary";

const dictionaries = {
    Anniversary: null,
    Simplified: null
};


/* =========================================================
   DISPLAY SETTINGS
   ========================================================= */

const IMG_WIDTH = 1281;
const DISPLAY_WIDTH = 365;
const DISPLAY_HEIGHT = 100;
const OFFSET = 5;


/* =========================================================
   1929 BOOK FALLBACK
   =========================================================

   These are entries taken from the 1929 Anniversary Manual.

   PDF page numbers below refer to the PDF page itself.
   ========================================================= */

const BOOK_ENTRIES = {

    "my": {
        page: 31,

        // Crop around the actual shorthand outline for "my"
        crop: {
            x: 300,
            y: 690,
            w: 170,
            h: 65
        }
    },

    "i am": {
        page: 31,

        crop: {
            x: 125,
            y: 555,
            w: 150,
            h: 55
        }
    },

    "of the": {
        page: 31,

        crop: {
            x: 70,
            y: 450,
            w: 110,
            h: 45
        }
    },

    "and the": {
        page: 31,

        crop: {
            x: 195,
            y: 450,
            w: 120,
            h: 45
        }
    },

    "will be": {
        page: 31,

        crop: {
            x: 330,
            y: 450,
            w: 125,
            h: 55
        }
    },

    "to the": {
        page: 31,

        crop: {
            x: 70,
            y: 490,
            w: 110,
            h: 45
        }
    },

    "that the": {
        page: 31,

        crop: {
            x: 195,
            y: 490,
            w: 120,
            h: 45
        }
    },

    "of you": {
        page: 31,

        crop: {
            x: 330,
            y: 490,
            w: 125,
            h: 45
        }
    },

    "it is": {
        page: 31,

        crop: {
            x: 70,
            y: 530,
            w: 110,
            h: 45
        }
    },

    "by the": {
        page: 31,

        crop: {
            x: 195,
            y: 530,
            w: 120,
            h: 45
        }
    },

    "it was": {
        page: 31,

        crop: {
            x: 330,
            y: 530,
            w: 125,
            h: 45
        }
    },

    "you can": {
        page: 31,

        crop: {
            x: 195,
            y: 555,
            w: 120,
            h: 45
        }
    },

    "he was": {
        page: 31,

        crop: {
            x: 330,
            y: 555,
            w: 125,
            h: 45
        }
    },

    "to you": {
        page: 31,

        crop: {
            x: 70,
            y: 595,
            w: 110,
            h: 45
        }
    },

    "at the": {
        page: 31,

        crop: {
            x: 195,
            y: 595,
            w: 120,
            h: 45
        }
    },

    "is the": {
        page: 31,

        crop: {
            x: 330,
            y: 595,
            w: 125,
            h: 45
        }
    }
};


/* =========================================================
   PDF
   ========================================================= */

let bookPDF = null;

async function loadBook() {

    try {

        bookPDF = await pdfjsLib.getDocument(
            "Gregg Shorthand Manual (1929) (1).pdf"
        ).promise;

        console.log("1929 Gregg Manual loaded.");

    } catch (error) {

        console.warn(
            "1929 Gregg Manual could not be loaded.",
            error
        );

    }
}


/* =========================================================
   LOAD DICTIONARY
   ========================================================= */

async function loadDictionary(edition) {

    if (dictionaries[edition]) {
        return dictionaries[edition];
    }

    const response = await fetch(
        DICTIONARY_URLS[edition] + "?v=" + Date.now()
    );

    const data = await response.json();

    const map = {};

    for (const page of data) {

        for (const word of page.words || []) {

            const term = String(word.t || "")
                .toLowerCase()
                .trim();

            if (!term) continue;

            if (!map[term]) {
                map[term] = {
                    page: page.page,
                    x: word.x,
                    y: word.y
                };
            }
        }
    }

    dictionaries[edition] = map;

    return map;
}


/* =========================================================
   NORMALIZE
   ========================================================= */

function normalizeWord(word) {

    return word
        .toLowerCase()
        .replace(/^[^a-z']+|[^a-z']+$/g, "")
        .trim();
}


/* =========================================================
   FIND DICTIONARY WORD
   ========================================================= */

async function findDictionaryWord(word) {

    const dictionary =
        await loadDictionary(currentEdition);

    return dictionary[normalizeWord(word)] || null;
}


/* =========================================================
   CREATE DICTIONARY OUTLINE
   ========================================================= */

function createDictionaryOutline(entry) {

    const box = document.createElement("div");
    box.className = "outline-box";

    const img = document.createElement("img");

    const pageNumber =
        String(entry.page).padStart(3, "0");

    img.src =
        PAGE_BASE[currentEdition] +
        pageNumber +
        ".png";

    img.onload = function () {

        const scale =
            IMG_WIDTH / img.naturalWidth;

        img.style.width =
            IMG_WIDTH + "px";

        img.style.left =
            -(entry.x * scale - OFFSET) + "px";

        img.style.top =
            -(entry.y * scale - DISPLAY_HEIGHT / 2) + "px";
    };

    box.appendChild(img);

    return box;
}


/* =========================================================
   CREATE BOOK OUTLINE
   ========================================================= */

async function createBookOutline(entry) {

    const canvas = document.createElement("canvas");

    canvas.width = DISPLAY_WIDTH * 2;
    canvas.height = DISPLAY_HEIGHT * 2;

    canvas.className = "book-canvas";

    if (!bookPDF) {
        return canvas;
    }

    try {

        const page =
            await bookPDF.getPage(entry.page);

        const scale = 2;

        const viewport =
            page.getViewport({ scale });

        const fullCanvas =
            document.createElement("canvas");

        fullCanvas.width =
            viewport.width;

        fullCanvas.height =
            viewport.height;

        const fullContext =
            fullCanvas.getContext("2d");

        await page.render({
            canvasContext: fullContext,
            viewport: viewport
        }).promise;

        const crop = entry.crop;

        const sx = crop.x * scale;
        const sy = crop.y * scale;
        const sw = crop.w * scale;
        const sh = crop.h * scale;

        const ctx =
            canvas.getContext("2d");

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.drawImage(
            fullCanvas,

            sx,
            sy,
            sw,
            sh,

            0,
            0,
            canvas.width,
            canvas.height
        );

    } catch (error) {

        console.error(
            "Book rendering error:",
            error
        );
    }

    return canvas;
}


/* =========================================================
   PHRASE MATCHING
   ========================================================= */

function findBookPhrase(words, startIndex) {

    // Longest phrase first.
    // This prevents:
    //
    // I am
    //
    // from becoming:
    //
    // I + am
    //

    const maxWords = 4;

    for (
        let count = maxWords;
        count >= 2;
        count--
    ) {

        const selected =
            words.slice(
                startIndex,
                startIndex + count
            );

        if (
            selected.length !== count
        ) continue;

        const phrase =
            selected
                .map(normalizeWord)
                .join(" ");

        if (BOOK_ENTRIES[phrase]) {

            return {
                phrase,
                entry: BOOK_ENTRIES[phrase],
                count
            };
        }
    }

    return null;
}


/* =========================================================
   RENDER
   ========================================================= */

async function render() {

    const input =
        document.getElementById("input").value;

    const results =
        document.getElementById("results");

    results.innerHTML = "";

    if (!input.trim()) {
        return;
    }

    const words =
        input.trim().split(/\s+/);

    let i = 0;

    while (i < words.length) {

        /* -----------------------------------------
           1. PHRASE FIRST
           ----------------------------------------- */

        const phraseMatch =
            findBookPhrase(words, i);

        if (phraseMatch) {

            const row =
                document.createElement("div");

            row.className = "word-row";

            const label =
                document.createElement("div");

            label.innerHTML = `
                <div class="english">
                    ${phraseMatch.phrase}
                </div>
                <div class="source">
                    1929 Manual — Phrase Drill
                </div>
            `;

            row.appendChild(label);

            const outline =
                await createBookOutline(
                    phraseMatch.entry
                );

            row.appendChild(outline);

            results.appendChild(row);

            i += phraseMatch.count;

            continue;
        }


        /* -----------------------------------------
           2. BRIEF FORM / BOOK
           ----------------------------------------- */

        const normalized =
            normalizeWord(words[i]);

        if (
            currentEdition === "Anniversary" &&
            BOOK_ENTRIES[normalized]
        ) {

            const row =
                document.createElement("div");

            row.className = "word-row";

            const label =
                document.createElement("div");

            label.innerHTML = `
                <div class="english">
                    ${words[i]}
                </div>
                <div class="source">
                    1929 Manual — Brief Form
                </div>
            `;

            row.appendChild(label);

            const outline =
                await createBookOutline(
                    BOOK_ENTRIES[normalized]
                );

            row.appendChild(outline);

            results.appendChild(row);

            i++;

            continue;
        }


        /* -----------------------------------------
           3. NORMAL DICTIONARY
           ----------------------------------------- */

        const entry =
            await findDictionaryWord(
                words[i]
            );

        const row =
            document.createElement("div");

        row.className = "word-row";

        const label =
            document.createElement("div");

        label.innerHTML = `
            <div class="english">
                ${words[i]}
            </div>
            <div class="source">
                ${entry
                    ? currentEdition + " Dictionary"
                    : "No outline found"}
            </div>
        `;

        row.appendChild(label);

        if (entry) {

            row.appendChild(
                createDictionaryOutline(entry)
            );

        } else {

            const missing =
                document.createElement("div");

            missing.className = "missing";

            missing.textContent =
                "No outline found yet";

            row.appendChild(missing);
        }

        results.appendChild(row);

        i++;
    }
}


/* =========================================================
   EVENTS
   ========================================================= */

let timer;

document
    .getElementById("input")
    .addEventListener("input", () => {

        clearTimeout(timer);

        timer = setTimeout(
            render,
            150
        );
    });


document
    .getElementById("anniversaryBtn")
    .addEventListener("click", async () => {

        currentEdition = "Anniversary";

        document
            .getElementById("anniversaryBtn")
            .classList.add("active");

        document
            .getElementById("simplifiedBtn")
            .classList.remove("active");

        await render();
    });


document
    .getElementById("simplifiedBtn")
    .addEventListener("click", async () => {

        currentEdition = "Simplified";

        document
            .getElementById("simplifiedBtn")
            .classList.add("active");

        document
            .getElementById("anniversaryBtn")
            .classList.remove("active");

        await render();
    });


/* =========================================================
   START
   ========================================================= */

await loadBook();
await loadDictionary("Anniversary");

</script>

</body>
</html>
