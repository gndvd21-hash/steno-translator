<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gregg Shorthand Translator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 25px;
}

h1 {
    margin: 0 0 4px;
}

.subtitle {
    color: #666;
    margin-bottom: 20px;
}

textarea {
    width: 100%;
    min-height: 120px;
    padding: 15px;
    font-size: 18px;
    border: 1px solid #ccc;
    border-radius: 10px;
    resize: vertical;
}

.controls {
    display: flex;
    gap: 10px;
    margin: 15px 0;
    align-items: center;
    flex-wrap: wrap;
}

select,
button {
    padding: 10px 14px;
    font-size: 15px;
    border: 1px solid #bbb;
    border-radius: 8px;
    background: white;
    cursor: pointer;
}

button:hover {
    background: #eee;
}

#status {
    color: #666;
    margin: 10px 0 15px;
}

.results {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 15px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    overflow: hidden;
}

.title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 4px;
}

.source {
    font-size: 12px;
    color: #888;
    margin-bottom: 10px;
}

.outline {
    width: 100%;
    height: 150px;
    overflow: hidden;
    position: relative;
    background: white;
}

.outline img {
    position: absolute;
    max-width: none;
}

.missing {
    color: #999;
    font-style: italic;
    padding: 30px 5px;
    text-align: center;
}

.pdf-card {
    grid-column: 1 / -1;
    background: #fffdf1;
    border: 1px solid #e5d98c;
}

.pdf-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 4px;
}

.pdf-info {
    color: #777;
    font-size: 13px;
    margin-bottom: 12px;
}

.pdf-crop {
    width: 100%;
    min-height: 220px;
    overflow: auto;
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    text-align: center;
}

.pdf-crop canvas {
    max-width: 100%;
    height: auto;
}

.pdf-failed {
    padding: 25px;
    color: #999;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

<h1>Gregg Shorthand Translator</h1>

<div class="subtitle">
English → Gregg Shorthand
</div>

<textarea id="inputText"
placeholder="Try: dear sir i am ready"></textarea>

<div class="controls">

<label>
Series:
<select id="series">
<option value="Anniversary">Anniversary</option>
<option value="Simplified">Simplified</option>
</select>
</label>

<button id="translateBtn">Translate</button>
<button id="clearBtn">Clear</button>

</div>

<div id="status">
Loading...
</div>

<div id="results" class="results"></div>

</div>


<script type="module">

/* =========================================================
   PDF.JS
   ========================================================= */

import * as pdfjsLib
from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


/* =========================================================
   SOURCES
   ========================================================= */

const GREGG_BASE =
    "https://raw.githubusercontent.com/richyliu/greggdict/master/assets/";

const MANUAL_PDF =
    "./Gregg%20Shorthand%20Manual%20(1929)%20(1).pdf";


/* =========================================================
   SETTINGS
   ========================================================= */

const IMG_WIDTH = 1281;

const DISPLAY_SIZE = {
    x: 365,
    y: 100,
    offset: 5
};


/* =========================================================
   VARIABLES
   ========================================================= */

let dictionary = [];
let pdfDocument = null;


/* =========================================================
   NORMALIZE
   ========================================================= */

function normalizeText(text) {

    return String(text || "")
        .toLowerCase()
        .replace(/[“”‘’]/g, "'")
        .replace(/[^a-z0-9']+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}


/* =========================================================
   GREGGDICT
   ========================================================= */

async function loadDictionary(series) {

    const url =
        GREGG_BASE +
        series +
        "/reference.json?cb=" +
        Date.now();

    const response =
        await fetch(url);

    if (!response.ok) {
        throw new Error(
            "Could not load Greggdict."
        );
    }

    dictionary =
        await response.json();

    return dictionary;
}


function findWord(word) {

    const target =
        normalizeText(word);

    for (const page of dictionary) {

        if (!page.words) continue;

        for (const item of page.words) {

            if (!item.t) continue;

            if (
                normalizeText(item.t) ===
                target
            ) {

                return {
                    page: page.page,
                    x: Number(item.x),
                    y: Number(item.y)
                };

            }
        }
    }

    return null;
}


function greggPage(series, page) {

    return (
        GREGG_BASE +
        series +
        "/pages/" +
        String(page).padStart(3, "0") +
        ".png"
    );
}


function renderGreggWord(
    container,
    series,
    entry
) {

    const img =
        document.createElement("img");

    img.src =
        greggPage(
            series,
            entry.page
        );

    img.onload = function() {

        const scale =
            IMG_WIDTH /
            img.naturalWidth;

        img.style.width =
            IMG_WIDTH + "px";

        img.style.top =
            -(
                entry.y * scale -
                DISPLAY_SIZE.y / 2
            ) + "px";

        img.style.left =
            -(
                entry.x * scale -
                DISPLAY_SIZE.offset
            ) + "px";
    };

    container.appendChild(img);
}


function createWordCard(
    word,
    series
) {

    const card =
        document.createElement("div");

    card.className =
        "card";

    const title =
        document.createElement("div");

    title.className =
        "title";

    title.textContent =
        word;

    card.appendChild(title);

    const source =
        document.createElement("div");

    source.className =
        "source";

    source.textContent =
        series + " — Greggdict";

    card.appendChild(source);

    const outline =
        document.createElement("div");

    outline.className =
        "outline";

    card.appendChild(outline);

    const entry =
        findWord(word);

    if (!entry) {

        outline.innerHTML =
            '<div class="missing">' +
            'No Greggdict entry' +
            '</div>';

    } else {

        renderGreggWord(
            outline,
            series,
            entry
        );
    }

    return card;
}


/* =========================================================
   LOAD PDF
   ========================================================= */

async function loadManual() {

    if (pdfDocument) {
        return pdfDocument;
    }

    pdfDocument =
        await pdfjsLib
            .getDocument(
                MANUAL_PDF
            )
            .promise;

    return pdfDocument;
}


/* =========================================================
   GET COMPLETE PAGE TEXT
   ========================================================= */

async function getPageData(pageNumber) {

    const page =
        await pdfDocument.getPage(
            pageNumber
        );

    const textContent =
        await page.getTextContent();

    const items =
        textContent.items || [];

    const text =
        normalizeText(
            items
                .map(
                    item =>
                        item.str || ""
                )
                .join(" ")
        );

    return {
        page,
        items,
        text
    };
}


/* =========================================================
   SEARCH ALL OCCURRENCES
   ========================================================= */

async function searchPDF(searchText) {

    const wanted =
        normalizeText(searchText);

    const candidates = [];

    for (
        let pageNumber = 1;
        pageNumber <= pdfDocument.numPages;
        pageNumber++
    ) {

        const data =
            await getPageData(
                pageNumber
            );

        const items =
            data.items;

        const pageText =
            data.text;

        /*
         * Page must contain the phrase somewhere.
         */

        if (
            !pageText.includes(wanted)
        ) {
            continue;
        }


        /*
         * Find the actual text item(s)
         * containing the phrase.
         */

        for (
            let i = 0;
            i < items.length;
            i++
        ) {

            let combined = "";

            let last = i;

            for (
                let j = i;
                j < Math.min(
                    items.length,
                    i + 8
                );
                j++
            ) {

                const part =
                    normalizeText(
                        items[j].str
                    );

                if (!part) continue;

                combined =
                    combined
                    ? combined + " " + part
                    : part;

                last = j;

                if (
                    combined.includes(
                        wanted
                    )
                ) {

                    /*
                     * SCORE THIS OCCURRENCE
                     */

                    let score = 0;

                    const context =
                        pageText;

                    /*
                     * Exact occurrence gets points.
                     */

                    if (
                        combined === wanted
                    ) {
                        score += 30;
                    }

                    /*
                     * Important Gregg sections.
                     */

                    if (
                        context.includes(
                            "business abbreviations"
                        )
                    ) {
                        score += 100;
                    }

                    if (
                        context.includes(
                            "brief forms for common words"
                        )
                    ) {
                        score += 90;
                    }

                    if (
                        context.includes(
                            "phrase drill"
                        )
                    ) {
                        score += 90;
                    }

                    if (
                        context.includes(
                            "phrasing"
                        )
                    ) {
                        score += 40;
                    }

                    /*
                     * Penalize obvious writing-practice
                     * / ordinary sentence pages.
                     */

                    if (
                        context.includes(
                            "writing practice"
                        )
                    ) {
                        score -= 25;
                    }

                    /*
                     * Penalize pages where phrase
                     * appears only inside a long
                     * ordinary sentence.
                     */

                    if (
                        combined !== wanted
                    ) {
                        score -= 5;
                    }

                    candidates.push({

                        pageNumber,

                        page:
                            data.page,

                        items,

                        item:
                            items[i],

                        item2:
                            items[last],

                        score,

                        context:
                            context

                    });

                    break;
                }
            }
        }
    }

    /*
     * Highest-quality match first.
     */

    candidates.sort(
        (a, b) =>
            b.score - a.score
    );

    return candidates;
}


/* =========================================================
   FIND BEST PDF MATCH
   ========================================================= */

async function findBestPDFMatch(
    phrase
) {

    const matches =
        await searchPDF(
            phrase
        );

    if (
        matches.length === 0
    ) {
        return null;
    }

    console.log(
        "PDF matches for:",
        phrase,
        matches
            .slice(0, 10)
            .map(
                m => ({
                    page:
                        m.pageNumber,
                    score:
                        m.score
                })
            )
    );

    return matches[0];
}


/* =========================================================
   RENDER PDF REGION
   ========================================================= */

async function renderPDFMatch(
    container,
    match
) {

    const page =
        match.page;

    const viewport =
        page.getViewport({
            scale: 2
        });

    /*
     * Text position.
     */

    const transform =
        match.item.transform;

    const pdfX =
        transform[4];

    const pdfY =
        transform[5];

    const point =
        viewport.convertToViewportPoint(
            pdfX,
            pdfY
        );

    const x =
        point[0];

    const y =
        point[1];


    /*
     * Region around the
     * actual Ctrl+F result.
     */

    const cropWidth =
        430;

    const cropHeight =
        190;


    /*
     * The shorthand in these
     * dictionary/abbreviation layouts
     * is normally immediately around
     * the matched English text.
     */

    let cropX =
        x - 120;

    let cropY =
        y - 105;


    /*
     * Keep crop inside page.
     */

    cropX =
        Math.max(
            0,
            Math.min(
                cropX,
                viewport.width -
                cropWidth
            )
        );

    cropY =
        Math.max(
            0,
            Math.min(
                cropY,
                viewport.height -
                cropHeight
            )
        );


    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        cropWidth;

    canvas.height =
        cropHeight;


    const fullCanvas =
        document.createElement(
            "canvas"
        );

    fullCanvas.width =
        Math.ceil(
            viewport.width
        );

    fullCanvas.height =
        Math.ceil(
            viewport.height
        );


    await page.render({

        canvasContext:
            fullCanvas.getContext(
                "2d"
            ),

        viewport

    }).promise;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.drawImage(

        fullCanvas,

        cropX,
        cropY,
        cropWidth,
        cropHeight,

        0,
        0,
        cropWidth,
        cropHeight

    );


    container.innerHTML = "";

    container.appendChild(
        canvas
    );
}


/* =========================================================
   PDF CARD
   ========================================================= */

async function createPDFCard(
    phrase
) {

    const match =
        await findBestPDFMatch(
            phrase
        );

    if (!match) {
        return null;
    }


    const card =
        document.createElement(
            "div"
        );

    card.className =
        "card pdf-card";


    const title =
        document.createElement(
            "div"
        );

    title.className =
        "pdf-title";

    title.textContent =
        phrase;

    card.appendChild(
        title
    );


    const info =
        document.createElement(
            "div"
        );

    info.className =
        "pdf-info";

    info.textContent =
        "Found in 1929 Gregg Shorthand Manual — page " +
        match.pageNumber;

    card.appendChild(
        info
    );


    const crop =
        document.createElement(
            "div"
        );

    crop.className =
        "pdf-crop";

    crop.innerHTML =
        '<div class="pdf-failed">' +
        'Rendering PDF entry...' +
        '</div>';

    card.appendChild(
        crop
    );


    await renderPDFMatch(
        crop,
        match
    );


    return card;
}


/* =========================================================
   GET PHRASES FROM INPUT
   ========================================================= */

function getPhraseCandidates(words) {

    const phrases = [];

    /*
     * Longest phrases first.
     *
     * This allows:
     *
     * "in my opinion"
     *
     * instead of:
     *
     * "in my"
     * "my opinion"
     */

    for (
        let length = 5;
        length >= 2;
        length--
    ) {

        for (
            let i = 0;
            i + length <= words.length;
            i++
        ) {

            const phrase =
                words
                    .slice(
                        i,
                        i + length
                    )
                    .join(" ");

            if (
                !phrases.some(
                    p =>
                        p === phrase
                )
            ) {

                phrases.push(
                    phrase
                );
            }
        }
    }

    return phrases;
}


/* =========================================================
   TRANSLATE
   ========================================================= */

async function translate() {

    const input =
        document
            .getElementById(
                "inputText"
            )
            .value
            .trim();

    const series =
        document
            .getElementById(
                "series"
            )
            .value;

    const results =
        document
            .getElementById(
                "results"
            );

    const status =
        document
            .getElementById(
                "status"
            );


    results.innerHTML = "";


    if (!input) {

        status.textContent =
            "Type something first.";

        return;
    }


    try {

        status.textContent =
            "Loading Greggdict...";

        await loadDictionary(
            series
        );


        status.textContent =
            "Opening 1929 Gregg Manual...";

        await loadManual();


        const words =
            input
                .toLowerCase()
                .split(/\s+/)
                .map(
                    w =>
                        w.replace(
                            /[^a-z']/g,
                            ""
                        )
                )
                .filter(Boolean);


        /*
         * =====================================================
         * PDF PHRASE SEARCH
         * =====================================================
         */

        const phrases =
            getPhraseCandidates(
                words
            );


        /*
         * Only display PDF matches.
         *
         * We don't want random ordinary
         * sentences filling the screen.
         */

        const shownPDFPages =
            new Set();


        for (
            const phrase of phrases
        ) {

            status.textContent =
                "Searching PDF for: " +
                phrase;


            const card =
                await createPDFCard(
                    phrase
                );


            if (!card) {
                continue;
            }


            /*
             * Avoid displaying the same
             * PDF page repeatedly.
             */

            const pageText =
                card
                    .querySelector(
                        ".pdf-info"
                    )
                    .textContent;


            const pageMatch =
                pageText.match(
                    /page (\d+)/
                );


            const pageNumber =
                pageMatch
                    ? pageMatch[1]
                    : "";


            /*
             * For now we allow different
             * phrases on the same page,
             * because the PDF may contain
             * multiple useful entries.
             */

            results.appendChild(
                card
            );
        }


        /*
         * =====================================================
         * GREGGDICT WORDS
         * =====================================================
         */

        status.textContent =
            "Rendering Greggdict words...";


        for (
            const word of words
        ) {

            results.appendChild(
                createWordCard(
                    word,
                    series
                )
            );
        }


        status.textContent =
            "Ready — Greggdict + 1929 PDF search";


    } catch(error) {

        console.error(error);

        status.textContent =
            "Error: " +
            error.message;
    }
}


/* =========================================================
   BUTTONS
   ========================================================= */

document
    .getElementById(
        "translateBtn"
    )
    .addEventListener(
        "click",
        translate
    );


document
    .getElementById(
        "clearBtn"
    )
    .addEventListener(
        "click",
        () => {

            document
                .getElementById(
                    "inputText"
                )
                .value = "";

            document
                .getElementById(
                    "results"
                )
                .innerHTML = "";

            document
                .getElementById(
                    "status"
                )
                .textContent =
                    "Ready.";
        }
    );


/* =========================================================
   INITIAL
   ========================================================= */

(async function() {

    try {

        await loadDictionary(
            "Anniversary"
        );

        document
            .getElementById(
                "status"
            )
            .textContent =
                "Ready.";

    } catch(error) {

        console.error(error);

        document
            .getElementById(
                "status"
            )
            .textContent =
                "Ready — click Translate to begin.";

    }

})();

</script>

</body>
</html>
