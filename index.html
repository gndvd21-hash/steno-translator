<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gregg Shorthand Converter</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 25px;
}

h1 {
    text-align: center;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px 0;
}

button {
    padding: 10px 18px;
    border: 1px solid #aaa;
    border-radius: 8px;
    background: white;
    cursor: pointer;
    font-size: 15px;
}

button.active {
    background: #222;
    color: white;
}

textarea {
    width: 100%;
    min-height: 130px;
    padding: 15px;
    font-size: 18px;
    border: 1px solid #bbb;
    border-radius: 10px;
    resize: vertical;
}

.output-title {
    margin-top: 25px;
    margin-bottom: 10px;
    font-size: 20px;
    font-weight: bold;
}

#output {
    background: white;
    border-radius: 10px;
    padding: 20px;
    min-height: 150px;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 12px;
}

.word-container {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.word-label {
    font-size: 12px;
    color: #777;
    margin-bottom: 4px;
}

/*
    EXACTLY like Richy Liu's small ImageDisplay:

    width  = 365px
    height = 100px
    offset = 5px
*/

.gregg-box {
    width: 365px;
    height: 100px;
    position: relative;
    overflow: hidden;
    border: 1px solid #000;
    background: white;
}

.gregg-page {
    position: absolute;
    max-width: none;
    height: auto;
    visibility: hidden;
}

.unknown {
    height: 100px;
    min-width: 100px;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 1px dashed #aaa;
    color: #888;
}

.status {
    width: 100%;
    text-align: center;
    color: #777;
}

.error {
    color: #b00020;
}

.fallback-label {
    font-size: 11px;
    color: #777;
    margin-top: 3px;
}

</style>
</head>

<body>

<div class="container">

<h1>Gregg Shorthand Converter</h1>

<div class="controls">

<button id="anniversaryBtn" class="active">
Gregg Anniversary
</button>

<button id="simplifiedBtn">
Gregg Simplified
</button>

</div>

<textarea
id="inputText"
placeholder="Type English text here...

Example:
The sister will tell him."
></textarea>

<div class="output-title">
Gregg Outlines
</div>

<div id="output">

<div class="status">
Type something above.
</div>

</div>

</div>


<script>

/*
=========================================================
DICTIONARY SOURCES
=========================================================
*/

const REPO_BASE =
"https://raw.githubusercontent.com/richyliu/greggdict/master/assets/";

const dictionaries = {

    Anniversary: {

        reference:
        REPO_BASE + "Anniversary/reference.json",

        pages:
        REPO_BASE + "Anniversary/pages/"

    },

    Simplified: {

        reference:
        REPO_BASE + "Simplified/reference.json",

        pages:
        REPO_BASE + "Simplified/pages/"

    }

};


let currentDictionary = "Anniversary";

let dictionary = {};

let simplifiedDictionary = {};

let loadingDictionary = false;


/*
=========================================================
BUILD DICTIONARY
=========================================================
*/

function buildDictionary(data) {

    const result = {};

    data.forEach(pageData => {

        pageData.words.forEach(entry => {

            const key =
                entry.t
                    .toLowerCase()
                    .trim();

            result[key] = {

                word: entry.t,

                page: pageData.page,

                x: entry.x,

                y: entry.y

            };

        });

    });

    return result;
}


/*
=========================================================
LOAD DICTIONARY
=========================================================
*/

async function loadDictionary(type) {

    loadingDictionary = true;

    showStatus(
        "Loading " + type + " dictionary..."
    );

    try {

        const response =
            await fetch(
                dictionaries[type].reference
            );

        if (!response.ok) {

            throw new Error(
                "Dictionary could not be loaded."
            );

        }

        const data =
            await response.json();


        /*
        Build the dictionary being selected.
        */

        const newDictionary =
            buildDictionary(data);


        /*
        If Simplified is selected,
        use Simplified normally.
        */

        if (type === "Simplified") {

            dictionary =
                newDictionary;

            simplifiedDictionary =
                newDictionary;

        }


        /*
        If Anniversary is selected,
        Anniversary remains the main dictionary.
        */

        else {

            dictionary =
                newDictionary;


            /*
            Load Simplified as a fallback
            if it has not already been loaded.
            */

            if (
                Object.keys(simplifiedDictionary).length === 0
            ) {

                const simplifiedResponse =
                    await fetch(
                        dictionaries.Simplified.reference
                    );

                if (simplifiedResponse.ok) {

                    const simplifiedData =
                        await simplifiedResponse.json();

                    simplifiedDictionary =
                        buildDictionary(
                            simplifiedData
                        );

                }

            }

        }


        currentDictionary =
            type;

        loadingDictionary =
            false;

        renderText();

    }

    catch(error) {

        console.error(error);

        loadingDictionary =
            false;

        showStatus(
            "Could not load dictionary.",
            true
        );

    }

}


/*
=========================================================
STATUS
=========================================================
*/

function showStatus(message, error = false) {

    document.getElementById("output").innerHTML =

    `<div class="status ${error ? "error" : ""}">
        ${message}
    </div>`;

}


/*
=========================================================
CREATE GREGG IMAGE
=========================================================
*/

function createGreggImage(
    entry,
    dictionaryType = currentDictionary
) {

    const box =
        document.createElement("div");

    box.className =
        "gregg-box";


    const image =
        document.createElement("img");

    image.className =
        "gregg-page";


    /*
    EXACT PAGE IMAGE FROM RICHY LIU
    */

    image.src =

        dictionaries[dictionaryType].pages +

        entry.page +

        ".png";


    /*
    Cache breaker just like the original app.
    */

    image.src +=
        "?cachebreaker=" +
        encodeURIComponent(
            entry.word + entry.y
        );


    /*
    =====================================================
    RICHY LIU ORIGINAL POSITIONING
    =====================================================
    */

    image.onload = function() {

        const IMG_WIDTH = 1281;

        const DISPLAY_WIDTH = 365;

        const DISPLAY_HEIGHT = 100;

        const OFFSET = 5;


        const scale =
            IMG_WIDTH /
            image.naturalWidth;


        image.style.width =
            IMG_WIDTH + "px";


        image.style.left =

            -(entry.x * scale - OFFSET)
            + "px";


        image.style.top =

            -(entry.y * scale -
            DISPLAY_HEIGHT / 2)
            + "px";


        image.style.visibility =
            "visible";

    };


    image.onerror = function() {

        box.innerHTML =
        `<div class="unknown">
            Image unavailable
        </div>`;

    };


    box.appendChild(image);

    return box;

}


/*
=========================================================
CREATE WORD
=========================================================
*/

function createWordElement(word) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "word-container";


    const label =
        document.createElement("div");

    label.className =
        "word-label";

    label.textContent =
        word;


    wrapper.appendChild(label);


    /*
    =====================================================
    FIRST LOOK IN THE CURRENT DICTIONARY
    =====================================================
    */

    const key =
        word.toLowerCase().trim();


    let entry =
        dictionary[key];


    let source =
        currentDictionary;


    /*
    =====================================================
    ANNIVERSARY FALLBACK
    =====================================================

    If the word does not exist in Anniversary,
    look for it in Simplified.

    The app still remains in Anniversary mode.
    */

    if (
        !entry &&
        currentDictionary === "Anniversary"
    ) {

        entry =
            simplifiedDictionary[key];


        if (entry) {

            source =
                "Simplified";

        }

    }


    /*
    =====================================================
    NO OUTLINE
    =====================================================
    */

    if (!entry) {

        const unknown =
            document.createElement("div");

        unknown.className =
            "unknown";

        unknown.textContent =
            "No outline";

        wrapper.appendChild(
            unknown
        );

        return wrapper;

    }


    /*
    =====================================================
    CREATE IMAGE
    =====================================================
    */

    const image =
        createGreggImage(
            entry,
            source
        );


    wrapper.appendChild(image);


    /*
    =====================================================
    IF SIMPLIFIED WAS USED AS FALLBACK
    =====================================================
    */

    if (
        currentDictionary === "Anniversary" &&
        source === "Simplified"
    ) {

        const fallbackLabel =
            document.createElement("div");

        fallbackLabel.className =
            "fallback-label";

        fallbackLabel.textContent =
            "(Simplified)";

        wrapper.appendChild(
            fallbackLabel
        );

    }


    return wrapper;

}


/*
=========================================================
RENDER TEXT
=========================================================
*/

function renderText() {

    const input =
        document.getElementById(
            "inputText"
        );


    const output =
        document.getElementById(
            "output"
        );


    const text =
        input.value.trim();


    if (!text) {

        output.innerHTML =

        `<div class="status">
            Type something above.
        </div>`;

        return;

    }


    if (
        !dictionary ||
        Object.keys(dictionary).length === 0
    ) {

        showStatus(
            "Dictionary is loading..."
        );

        return;

    }


    output.innerHTML = "";


    /*
    =====================================================
    SEPARATE THE SENTENCE INTO WORDS
    =====================================================
    */

    const words =
        text.split(/\s+/);


    words.forEach(originalWord => {

        /*
        Remove punctuation for lookup.

        Example:

        "tell," -> "tell"

        "sister." -> "sister"
        */

        const cleanWord =
            originalWord.replace(
                /^[^a-zA-Z]+|[^a-zA-Z]+$/g,
                ""
            );


        if (!cleanWord) {
            return;
        }


        const element =
            createWordElement(
                cleanWord
            );


        output.appendChild(
            element
        );

    });

}


/*
=========================================================
BUTTONS
=========================================================
*/

document
.getElementById("anniversaryBtn")
.addEventListener(
    "click",
    async () => {

        document
        .getElementById(
            "anniversaryBtn"
        )
        .classList.add("active");


        document
        .getElementById(
            "simplifiedBtn"
        )
        .classList.remove("active");


        await loadDictionary(
            "Anniversary"
        );

    }
);


document
.getElementById("simplifiedBtn")
.addEventListener(
    "click",
    async () => {

        document
        .getElementById(
            "simplifiedBtn"
        )
        .classList.add("active");


        document
        .getElementById(
            "anniversaryBtn"
        )
        .classList.remove("active");


        await loadDictionary(
            "Simplified"
        );

    }
);


/*
=========================================================
LIVE INPUT
=========================================================
*/

document
.getElementById("inputText")
.addEventListener(
    "input",
    renderText
);


/*
=========================================================
START
=========================================================
*/

loadDictionary(
    "Anniversary"
);

</script>

</body>
</html>
