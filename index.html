<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gregg Shorthand Translator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

h1 {
    margin-top: 0;
}

textarea {
    width: 100%;
    height: 120px;
    padding: 14px;
    font-size: 18px;
    border: 1px solid #ccc;
    border-radius: 8px;
    resize: vertical;
}

.controls {
    margin: 14px 0;
}

button {
    padding: 10px 18px;
    margin-right: 8px;
    border: 1px solid #aaa;
    border-radius: 7px;
    background: white;
    font-size: 15px;
}

button.active {
    background: #222;
    color: white;
}

#status {
    color: #777;
    font-size: 13px;
    margin-bottom: 15px;
}

#results {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.card {
    width: 385px;
    max-width: 100%;
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 8px;
}

.label {
    font-weight: bold;
    text-align: center;
    margin-bottom: 5px;
    font-size: 16px;
}

.source {
    text-align: center;
    color: #888;
    font-size: 11px;
    margin-top: 4px;
}

.outline {
    width: 365px;
    max-width: 100%;
    height: 100px;
    margin: auto;
    position: relative;
    overflow: hidden;
    background: white;
}

.outline img {
    position: absolute;
    max-width: none;
}

.missing {
    width: 100%;
    height: 100px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #aaa;
    font-size: 13px;
}
</style>
</head>

<body>

<h1>Gregg Shorthand Translator</h1>

<textarea
    id="input"
    placeholder="Type English text here..."
></textarea>

<div class="controls">

    <button
        id="anniversaryBtn"
        class="active"
    >
        Anniversary
    </button>

    <button
        id="simplifiedBtn"
    >
        Simplified
    </button>

</div>

<div id="status">
    Loading dictionaries...
</div>

<div id="results"></div>


<script>

/* =========================================================
   GREGGDICT
========================================================= */

const BASE =
"https://raw.githubusercontent.com/richyliu/greggdict/master/assets/";


/* =========================================================
   DISPLAY SETTINGS
   These match the original greggdict viewer.
========================================================= */

const IMG_WIDTH = 1281;

const DISPLAY_WIDTH = 365;

const DISPLAY_HEIGHT = 100;

const OFFSET = 5;


/* =========================================================
   CURRENT SERIES
========================================================= */

let series = "Anniversary";

let anniversaryDictionary = null;

let simplifiedDictionary = null;


/* =========================================================
   ANNIVERSARY PHRASES
   Phrase-first lookup.

   These are phrases specifically encountered in
   Anniversary Gregg material / phrase drills.

   Longest phrases are checked first.
========================================================= */

const ANNIVERSARY_PHRASES = [

    /* Longer phrases first */

    "at the same time",
    "in other words",
    "once in a while",
    "in my opinion",
    "in the first place",
    "as soon as possible",
    "as a matter of fact",
    "in due course",

    "dear sir",
    "dear madam",

    "we shall not",
    "we shall be",
    "we have been",
    "we have not",

    "we will not",
    "we will be",

    "we are not",
    "we are",

    "we will",
    "we shall",
    "we can",
    "we cannot",
    "we have",

    "i will",
    "i am",
    "i can",
    "i have",
    "i was",

    "you will",
    "you can",
    "you were",
    "you have",
    "you are",

    "he will",
    "he can",
    "he was",
    "he is",

    "it will",
    "it was",
    "it is",

    "of the",
    "and the",
    "will be",
    "to the",
    "that the",
    "of you",
    "by the",
    "to you",
    "at the",
    "is the",

    "my dear",
    "your dear",

    "as well as",
    "as well",

    "thank you",
    "thank you very much",

    "good morning",
    "good afternoon",
    "good evening",

    "in order to",
    "in order",

    "for the",
    "from the",
    "with the",
    "on the",
    "for you",
    "with you",
    "to me",
    "to my",

    "at once",

    "there is",
    "there are",
    "there will",
    "there was",

    "this is",
    "that is",
    "these are",
    "those are"

].map(normalize).sort(
    (a,b) =>
        b.split(" ").length -
        a.split(" ").length
);


/* =========================================================
   NORMALIZE
========================================================= */

function normalize(text) {

    return text
        .toLowerCase()
        .replace(/[“”‘’]/g, "'")
        .replace(/[.,!?;:()[\]{}"]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}


/* =========================================================
   CLEAN WORD
========================================================= */

function cleanWord(word) {

    return word
        .toLowerCase()
        .replace(/^[^a-z]+/i, "")
        .replace(/[^a-z]+$/i, "");
}


/* =========================================================
   LOAD DICTIONARY
========================================================= */

async function loadDictionary(name) {

    const url =
        BASE +
        name +
        "/reference.json?cb=" +
        Date.now();

    const response =
        await fetch(url);

    if (!response.ok) {

        throw new Error(
            "Could not load " + name
        );

    }

    return await response.json();
}


/* =========================================================
   FIND WORD
========================================================= */

function findWord(word) {

    const dictionary =
        series === "Anniversary"
            ? anniversaryDictionary
            : simplifiedDictionary;

    if (!dictionary) {
        return null;
    }

    const target =
        cleanWord(word);

    for (const page of dictionary) {

        if (!page.words) {
            continue;
        }

        for (const entry of page.words) {

            if (
                cleanWord(entry.t) ===
                target
            ) {

                return {
                    page: page.page,
                    x: entry.x,
                    y: entry.y,
                    term: entry.t
                };

            }

        }

    }

    return null;
}


/* =========================================================
   FIND PHRASE
========================================================= */

function findPhrase(words, index) {

    if (series !== "Anniversary") {
        return null;
    }

    for (
        const phrase of ANNIVERSARY_PHRASES
    ) {

        const phraseWords =
            phrase.split(" ");

        if (
            index +
            phraseWords.length >
            words.length
        ) {
            continue;
        }

        const candidate =
            words
                .slice(
                    index,
                    index + phraseWords.length
                )
                .join(" ");

        if (candidate === phrase) {

            return {
                text: phrase,
                count: phraseWords.length
            };

        }

    }

    return null;
}


/* =========================================================
   RENDER WORD FROM GREGGDICT
========================================================= */

function renderWord(entry, container) {

    if (!entry) {

        container.innerHTML =
            `<div class="missing">
                Not found
             </div>`;

        return;

    }

    const img =
        document.createElement("img");

    img.src =
        BASE +
        series +
        "/pages/" +
        String(entry.page).padStart(3, "0") +
        ".png?cb=" +
        Date.now();

    img.onload = function() {

        const scale =
            IMG_WIDTH /
            img.naturalWidth;

        img.style.width =
            IMG_WIDTH + "px";

        img.style.left =
            -(
                entry.x * scale -
                OFFSET
            ) + "px";

        img.style.top =
            -(
                entry.y * scale -
                DISPLAY_HEIGHT / 2
            ) + "px";

    };

    container.innerHTML = "";

    container.appendChild(img);
}


/* =========================================================
   PHRASE DISPLAY
========================================================= */

/*
   IMPORTANT:

   The phrase itself is recognized as ONE UNIT.

   Until we have an Anniversary phrase-image coordinate
   database, we don't pretend that two individual
   dictionary words are one Gregg phrase.

   Instead we display a phrase card and provide the
   phrase source information.

   Individual words continue to use real greggdict
   scanned outlines.
*/

function renderPhrase(phrase, container) {

    container.innerHTML = "";

    const box =
        document.createElement("div");

    box.style.width = "100%";
    box.style.height = "100px";
    box.style.display = "flex";
    box.style.alignItems = "center";
    box.style.justifyContent = "center";
    box.style.textAlign = "center";
    box.style.fontSize = "13px";
    box.style.color = "#777";
    box.style.padding = "10px";

    box.innerHTML =
        "Anniversary phrase recognized<br>" +
        "<b>" +
        phrase +
        "</b>";

    container.appendChild(box);
}


/* =========================================================
   CREATE CARD
========================================================= */

function createCard(
    label,
    source
) {

    const card =
        document.createElement("div");

    card.className =
        "card";

    card.innerHTML = `
        <div class="label">
            ${escapeHTML(label)}
        </div>

        <div class="outline"></div>

        <div class="source">
            ${escapeHTML(source)}
        </div>
    `;

    return card;
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   TRANSLATE
========================================================= */

async function translate() {

    const input =
        document
            .getElementById("input")
            .value;

    const results =
        document
            .getElementById("results");

    results.innerHTML = "";

    const normalized =
        normalize(input);

    if (!normalized) {
        return;
    }

    const words =
        normalized.split(" ");

    let index = 0;

    while (index < words.length) {

        /* -----------------------------------------------
           PHRASE FIRST
        ------------------------------------------------ */

        const phrase =
            findPhrase(
                words,
                index
            );

        if (phrase) {

            const card =
                createCard(
                    phrase.text,
                    "Anniversary phrase"
                );

            results.appendChild(card);

            const outline =
                card.querySelector(
                    ".outline"
                );

            renderPhrase(
                phrase.text,
                outline
            );

            index += phrase.count;

            continue;
        }


        /* -----------------------------------------------
           INDIVIDUAL WORD
        ------------------------------------------------ */

        const word =
            words[index];

        const entry =
            findWord(word);

        const card =
            createCard(
                word,
                series + " dictionary"
            );

        results.appendChild(card);

        const outline =
            card.querySelector(
                ".outline"
            );

        renderWord(
            entry,
            outline
        );

        index++;

    }

}


/* =========================================================
   BUTTONS
========================================================= */

document
    .getElementById("anniversaryBtn")
    .addEventListener(
        "click",
        async function() {

            series = "Anniversary";

            this.classList.add("active");

            document
                .getElementById(
                    "simplifiedBtn"
                )
                .classList.remove("active");

            await translate();

        }
    );


document
    .getElementById("simplifiedBtn")
    .addEventListener(
        "click",
        async function() {

            series = "Simplified";

            this.classList.add("active");

            document
                .getElementById(
                    "anniversaryBtn"
                )
                .classList.remove("active");

            await translate();

        }
    );


/* =========================================================
   LIVE TRANSLATION
========================================================= */

let timer = null;

document
    .getElementById("input")
    .addEventListener(
        "input",
        function() {

            clearTimeout(timer);

            timer =
                setTimeout(
                    translate,
                    300
                );

        }
    );


/* =========================================================
   INITIAL LOAD
========================================================= */

(async function() {

    const status =
        document.getElementById(
            "status"
        );

    try {

        status.textContent =
            "Loading Anniversary dictionary...";

        anniversaryDictionary =
            await loadDictionary(
                "Anniversary"
            );

        status.textContent =
            "Loading Simplified dictionary...";

        simplifiedDictionary =
            await loadDictionary(
                "Simplified"
            );

        status.textContent =
            "Ready.";

    } catch(error) {

        console.error(error);

        status.textContent =
            "Dictionary loading error.";

    }

})();

</script>

</body>
</html>
