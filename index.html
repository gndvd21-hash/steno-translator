<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gregg Shorthand Converter</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        color: #222;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 25px;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    .controls {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    button {
        padding: 10px 18px;
        border: 1px solid #aaa;
        border-radius: 8px;
        background: white;
        cursor: pointer;
        font-size: 15px;
    }

    button.active {
        background: #222;
        color: white;
    }

    textarea {
        width: 100%;
        min-height: 130px;
        resize: vertical;
        padding: 15px;
        font-size: 18px;
        border: 1px solid #bbb;
        border-radius: 10px;
        outline: none;
    }

    .output-title {
        margin-top: 25px;
        margin-bottom: 10px;
        font-size: 20px;
        font-weight: bold;
    }

    #output {
        background: white;
        border-radius: 10px;
        padding: 20px;
        min-height: 150px;
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 10px;
    }

    .word-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 10px;
    }

    .word-label {
        font-size: 12px;
        color: #777;
        margin-bottom: 3px;
    }

    /*
       Richy Liu's original dictionary uses:
       small display = 365 x 100
       source image width = 1281
    */

    .gregg-box {
        width: 365px;
        height: 100px;
        overflow: hidden;
        position: relative;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 5px;
    }

    .gregg-page {
        position: absolute;
        width: 1281px;
        max-width: none;
        height: auto;
        user-select: none;
        pointer-events: none;
    }

    .unknown {
        width: auto;
        height: 100px;
        min-width: 80px;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px dashed #aaa;
        border-radius: 5px;
        color: #888;
        font-size: 14px;
    }

    .status {
        text-align: center;
        color: #777;
        margin-top: 15px;
    }

    .error {
        color: #b00020;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Gregg Shorthand Converter</h1>

    <div class="controls">
        <button id="anniversaryBtn" class="active">
            Gregg Anniversary
        </button>

        <button id="simplifiedBtn">
            Gregg Simplified
        </button>
    </div>

    <textarea
        id="inputText"
        placeholder="Type English text here...

Example:
The sister will tell him."
    ></textarea>

    <div class="output-title">
        Gregg Outlines
    </div>

    <div id="output">
        <div class="status">
            Type something above.
        </div>
    </div>

</div>

<script>

const REPO_BASE =
    "https://raw.githubusercontent.com/richyliu/greggdict/master/assets/";

const dictionaries = {
    Anniversary: {
        reference:
            REPO_BASE + "Anniversary/reference.json",

        pages:
            REPO_BASE + "Anniversary/pages/"
    },

    Simplified: {
        reference:
            REPO_BASE + "Simplified/reference.json",

        pages:
            REPO_BASE + "Simplified/pages/"
    }
};

let currentDictionary = "Anniversary";

let dictionary = {};

let loadingDictionary = false;


/*
=========================================================
LOAD DICTIONARY
=========================================================
*/

async function loadDictionary(type) {

    if (loadingDictionary) return;

    loadingDictionary = true;

    showStatus("Loading " + type + " dictionary...");

    try {

        const response =
            await fetch(dictionaries[type].reference);

        if (!response.ok) {
            throw new Error(
                "Could not load dictionary reference."
            );
        }

        const data = await response.json();

        dictionary = {};

        /*
        Richy Liu's reference file is:

        [
            {
                page: "001",
                words: [
                    {
                        t: "word",
                        x: 123,
                        y: 456
                    }
                ]
            }
        ]
        */

        data.forEach(pageData => {

            const page = pageData.page;

            pageData.words.forEach(entry => {

                const word =
                    entry.t.toLowerCase().trim();

                /*
                Exact lookup.

                This means:

                tell

                will NOT match:

                teller
                telling
                tellurium
                */

                if (!dictionary[word]) {

                    dictionary[word] = {
                        word: entry.t,
                        page: page,
                        x: entry.x,
                        y: entry.y
                    };

                }

            });

        });

        currentDictionary = type;

        loadingDictionary = false;

        renderText();

    } catch (error) {

        console.error(error);

        loadingDictionary = false;

        showStatus(
            "Unable to load the " +
            type +
            " dictionary.",
            true
        );
    }
}


/*
=========================================================
DISPLAY STATUS
=========================================================
*/

function showStatus(message, error = false) {

    const output =
        document.getElementById("output");

    output.innerHTML =
        `<div class="status ${error ? "error" : ""}">
            ${message}
        </div>`;
}


/*
=========================================================
NORMALIZE WORD
=========================================================
*/

function normalizeWord(word) {

    return word
        .toLowerCase()
        .trim();

}


/*
=========================================================
CREATE GREGG IMAGE
=========================================================
*/

function createGreggImage(entry) {

    /*
    Richy Liu's original ImageDisplay:

        DISPLAY_SIZE_SMALL
        x = 365
        y = 100

        IMG_WIDTH = 1281

    The reference coordinates are based on
    the original dictionary image.
    */

    const box =
        document.createElement("div");

    box.className =
        "gregg-box";


    const image =
        document.createElement("img");

    image.className =
        "gregg-page";

    image.draggable = false;


    image.src =
        dictionaries[currentDictionary].pages +
        entry.page +
        ".png";


    /*
    The reference coordinates are on the
    original 1281px-wide image.

    We position the image so the requested
    dictionary entry appears inside the
    365x100 viewing window.
    */

    image.style.left =
        (182.5 - entry.x) + "px";

    image.style.top =
        (50 - entry.y) + "px";


    image.onerror = function() {

        box.innerHTML =
            "<div class='unknown'>" +
            "Image unavailable" +
            "</div>";

    };


    box.appendChild(image);

    return box;
}


/*
=========================================================
CREATE WORD RESULT
=========================================================
*/

function createWordElement(word) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "word-container";


    const label =
        document.createElement("div");

    label.className =
        "word-label";

    label.textContent =
        word;


    wrapper.appendChild(label);


    const normalized =
        normalizeWord(word);


    /*
    EXACT MATCH ONLY
    */

    const entry =
        dictionary[normalized];


    if (!entry) {

        const unknown =
            document.createElement("div");

        unknown.className =
            "unknown";

        unknown.textContent =
            "No outline";

        wrapper.appendChild(unknown);

        return wrapper;
    }


    const image =
        createGreggImage(entry);

    wrapper.appendChild(image);


    return wrapper;
}


/*
=========================================================
RENDER TEXT
=========================================================
*/

function renderText() {

    const input =
        document.getElementById("inputText");

    const output =
        document.getElementById("output");


    const text =
        input.value.trim();


    if (!text) {

        output.innerHTML =
            `<div class="status">
                Type something above.
            </div>`;

        return;
    }


    if (
        !dictionary ||
        Object.keys(dictionary).length === 0
    ) {

        showStatus(
            "Dictionary is still loading..."
        );

        return;
    }


    output.innerHTML = "";


    /*
    Split text into words.

    Punctuation is removed ONLY for the
    dictionary lookup, while the original
    word is still displayed as the label.
    */

    const words =
        text.split(/\s+/);


    words.forEach(originalWord => {

        const lookupWord =
            originalWord
                .replace(
                    /^[^a-zA-Z]+|[^a-zA-Z]+$/g,
                    ""
                );


        if (!lookupWord) {
            return;
        }


        const element =
            createWordElement(lookupWord);


        output.appendChild(element);

    });

}


/*
=========================================================
BUTTONS
=========================================================
*/

const anniversaryBtn =
    document.getElementById(
        "anniversaryBtn"
    );

const simplifiedBtn =
    document.getElementById(
        "simplifiedBtn"
    );


anniversaryBtn.addEventListener(
    "click",
    async function() {

        anniversaryBtn.classList.add("active");

        simplifiedBtn.classList.remove("active");

        await loadDictionary("Anniversary");

    }
);


simplifiedBtn.addEventListener(
    "click",
    async function() {

        simplifiedBtn.classList.add("active");

        anniversaryBtn.classList.remove("active");

        await loadDictionary("Simplified");

    }
);


/*
=========================================================
LIVE TEXT INPUT
=========================================================
*/

document
    .getElementById("inputText")
    .addEventListener(
        "input",
        renderText
    );


/*
=========================================================
START
=========================================================
*/

loadDictionary("Anniversary");

</script>

</body>
</html>
