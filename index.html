<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gregg Shorthand Converter</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 25px;
}

h1 {
    text-align: center;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px 0;
}

button {
    padding: 10px 18px;
    border: 1px solid #aaa;
    border-radius: 8px;
    background: white;
    cursor: pointer;
    font-size: 15px;
}

button.active {
    background: #222;
    color: white;
}

textarea {
    width: 100%;
    min-height: 130px;
    padding: 15px;
    font-size: 18px;
    border: 1px solid #bbb;
    border-radius: 10px;
    resize: vertical;
}

.output-title {
    margin-top: 25px;
    margin-bottom: 10px;
    font-size: 20px;
    font-weight: bold;
}

#output {
    background: white;
    border-radius: 10px;
    padding: 20px;
    min-height: 150px;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 12px;
}

.word-container {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.word-label {
    font-size: 12px;
    color: #777;
    margin-bottom: 4px;
}

/*
    EXACTLY like Richy Liu's small ImageDisplay:

    width  = 365px
    height = 100px
    offset = 5px
*/

.gregg-box {
    width: 365px;
    height: 100px;
    position: relative;
    overflow: hidden;
    border: 1px solid #000;
    background: white;
}

.gregg-page {
    position: absolute;
    max-width: none;
    height: auto;
    visibility: hidden;
}

.unknown {
    height: 100px;
    min-width: 100px;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 1px dashed #aaa;
    color: #888;
}

.status {
    width: 100%;
    text-align: center;
    color: #777;
}

.error {
    color: #b00020;
}

</style>
</head>

<body>

<div class="container">

<h1>Gregg Shorthand Converter</h1>

<div class="controls">

<button id="anniversaryBtn" class="active">
Gregg Anniversary
</button>

<button id="simplifiedBtn">
Gregg Simplified
</button>

</div>

<textarea
id="inputText"
placeholder="Type English text here...

Example:
The sister will tell him."
></textarea>

<div class="output-title">
Gregg Outlines
</div>

<div id="output">

<div class="status">
Type something above.
</div>

</div>

</div>


<script>

/*
=========================================================
DICTIONARY SOURCES
=========================================================
*/

const REPO_BASE =
"https://raw.githubusercontent.com/richyliu/greggdict/master/assets/";

const dictionaries = {

    Anniversary: {

        reference:
        REPO_BASE + "Anniversary/reference.json",

        pages:
        REPO_BASE + "Anniversary/pages/"

    },

    Simplified: {

        reference:
        REPO_BASE + "Simplified/reference.json",

        pages:
        REPO_BASE + "Simplified/pages/"

    }

};


let currentDictionary = "Anniversary";

let dictionary = {};

let loadingDictionary = false;


/*
=========================================================
LOAD DICTIONARY
=========================================================
*/

async function loadDictionary(type) {

    loadingDictionary = true;

    showStatus(
        "Loading " + type + " dictionary..."
    );

    try {

        const response =
        await fetch(
            dictionaries[type].reference
        );

        if (!response.ok) {

            throw new Error(
                "Dictionary could not be loaded."
            );

        }

        const data =
        await response.json();

        dictionary = {};


        /*
        Build exact word lookup.

        Example:

        "tell" -> tell entry

        It will NOT match:
        teller
        telling
        tellurium
        */

        data.forEach(pageData => {

            pageData.words.forEach(entry => {

                const key =
                entry.t
                    .toLowerCase()
                    .trim();

                dictionary[key] = {

                    word: entry.t,

                    page: pageData.page,

                    x: entry.x,

                    y: entry.y

                };

            });

        });


        currentDictionary = type;

        loadingDictionary = false;

        renderText();

    }

    catch(error) {

        console.error(error);

        loadingDictionary = false;

        showStatus(
            "Could not load dictionary.",
            true
        );

    }

}


/*
=========================================================
STATUS
=========================================================
*/

function showStatus(message, error = false) {

    document.getElementById("output").innerHTML =

    `<div class="status ${error ? "error" : ""}">
        ${message}
    </div>`;

}


/*
=========================================================
CREATE GREGG IMAGE
=========================================================
*/

function createGreggImage(entry) {

    const box =
    document.createElement("div");

    box.className =
    "gregg-box";


    const image =
    document.createElement("img");

    image.className =
    "gregg-page";


    /*
    EXACT PAGE IMAGE FROM RICHY LIU
    */

    image.src =

        dictionaries[currentDictionary].pages +

        entry.page +

        ".png";


    /*
    Cache breaker just like the original app.
    */

    image.src +=
        "?cachebreaker=" +
        encodeURIComponent(
            entry.word + entry.y
        );


    /*
    =====================================================
    THIS IS THE IMPORTANT PART
    =====================================================

    Richy Liu's original code does:

        scale = 1281 / naturalWidth

    Then:

        width = 1281

        left = -(x * scale - 5)

        top = -(y * scale - 50)

    We now do exactly that.
    */


    image.onload = function() {

        const IMG_WIDTH = 1281;

        const DISPLAY_WIDTH = 365;

        const DISPLAY_HEIGHT = 100;

        const OFFSET = 5;


        /*
        Calculate the scale from the actual
        dictionary image.
        */

        const scale =
            IMG_WIDTH /
            image.naturalWidth;


        /*
        Set the image to Richy Liu's
        1281px display width.
        */

        image.style.width =
            IMG_WIDTH + "px";


        /*
        Position horizontally.

        Original:

        left:
        -(word.x * scale - displaySize.offset)
        */

        image.style.left =

            -(entry.x * scale - OFFSET)
            + "px";


        /*
        Position vertically.

        Original:

        top:
        -(word.y * scale - displaySize.y / 2)
        */

        image.style.top =

            -(entry.y * scale -
            DISPLAY_HEIGHT / 2)
            + "px";


        /*
        NOW show the image.
        */

        image.style.visibility =
            "visible";

    };


    image.onerror = function() {

        box.innerHTML =
        `<div class="unknown">
            Image unavailable
        </div>`;

    };


    box.appendChild(image);

    return box;

}


/*
=========================================================
CREATE WORD
=========================================================
*/

function createWordElement(word) {

    const wrapper =
    document.createElement("div");

    wrapper.className =
    "word-container";


    const label =
    document.createElement("div");

    label.className =
    "word-label";

    label.textContent =
    word;


    wrapper.appendChild(label);


    /*
    EXACT LOOKUP
    */

    const key =
    word.toLowerCase().trim();


    const entry =
    dictionary[key];


    if (!entry) {

        const unknown =
        document.createElement("div");

        unknown.className =
        "unknown";

        unknown.textContent =
        "No outline";

        wrapper.appendChild(
            unknown
        );

        return wrapper;

    }


    const image =
    createGreggImage(entry);


    wrapper.appendChild(image);


    return wrapper;

}


/*
=========================================================
RENDER TEXT
=========================================================
*/

function renderText() {

    const input =
    document.getElementById(
        "inputText"
    );


    const output =
    document.getElementById(
        "output"
    );


    const text =
    input.value.trim();


    if (!text) {

        output.innerHTML =

        `<div class="status">
            Type something above.
        </div>`;

        return;

    }


    if (
        !dictionary ||
        Object.keys(dictionary).length === 0
    ) {

        showStatus(
            "Dictionary is loading..."
        );

        return;

    }


    output.innerHTML = "";


    /*
    Separate the sentence into words.
    */

    const words =
    text.split(/\s+/);


    words.forEach(originalWord => {

        /*
        Remove punctuation for lookup.

        Example:

        "tell," -> "tell"

        "sister." -> "sister"
        */

        const cleanWord =
        originalWord.replace(
            /^[^a-zA-Z]+|[^a-zA-Z]+$/g,
            ""
        );


        if (!cleanWord) {
            return;
        }


        const element =
        createWordElement(
            cleanWord
        );


        output.appendChild(
            element
        );

    });

}


/*
=========================================================
BUTTONS
=========================================================
*/

document
.getElementById("anniversaryBtn")
.addEventListener(
    "click",
    async () => {

        document
        .getElementById(
            "anniversaryBtn"
        )
        .classList.add("active");


        document
        .getElementById(
            "simplifiedBtn"
        )
        .classList.remove("active");


        await loadDictionary(
            "Anniversary"
        );

    }
);


document
.getElementById("simplifiedBtn")
.addEventListener(
    "click",
    async () => {

        document
        .getElementById(
            "simplifiedBtn"
        )
        .classList.add("active");


        document
        .getElementById(
            "anniversaryBtn"
        )
        .classList.remove("active");


        await loadDictionary(
            "Simplified"
        );

    }
);


/*
=========================================================
LIVE INPUT
=========================================================
*/

document
.getElementById("inputText")
.addEventListener(
    "input",
    renderText
);


/*
=========================================================
START
=========================================================
*/

loadDictionary(
    "Anniversary"
);

</script>

</body>
</html>
