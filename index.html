<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gregg Shorthand Converter</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
        type="module"></script>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 40px;
    }

    h1 {
        text-align: center;
    }

    .buttons {
        text-align: center;
        margin: 20px 0;
    }

    button {
        padding: 10px 20px;
        margin: 5px;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
    }

    button.active {
        background: #222;
        color: white;
    }

    textarea {
        display: block;
        width: 90%;
        max-width: 1100px;
        height: 100px;
        margin: auto;
        padding: 15px;
        font-size: 18px;
        border: 2px solid #222;
        border-radius: 10px;
        resize: vertical;
    }

    #results {
        width: 90%;
        max-width: 1100px;
        margin: 30px auto;
    }

    .card {
        background: white;
        border-radius: 12px;
        margin-bottom: 10px;
        padding: 15px;
        min-height: 90px;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .word {
        width: 180px;
        font-weight: bold;
        font-size: 18px;
    }

    .source {
        font-size: 12px;
        color: #777;
        margin-top: 5px;
        font-weight: normal;
    }

    .outline {
        position: relative;
        width: 365px;
        height: 100px;
        overflow: hidden;
        background: white;
        flex-shrink: 0;
    }

    .outline img {
        position: absolute;
        max-width: none;
        display: block;
    }

    .error {
        color: #999;
        font-size: 14px;
    }
</style>
</head>

<body>

<h1>Gregg Shorthand Converter</h1>

<div class="buttons">
    <button id="annBtn" class="active">Anniversary</button>
    <button id="simpBtn">Simplified</button>
</div>

<textarea id="input" placeholder="Type English text here..."></textarea>

<div id="results"></div>

<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


/* =========================================================
   SETTINGS
========================================================= */

const PDF_FILE = "Gregg Shorthand Manual (1929) (1).pdf";

const DICTIONARY = {
    Anniversary:
    "https://raw.githubusercontent.com/richyliu/greggdict/master/assets/Anniversary/reference.json",

    Simplified:
    "https://raw.githubusercontent.com/richyliu/greggdict/master/assets/Simplified/reference.json"
};

let currentEdition = "Anniversary";

let dictionary = {
    Anniversary: [],
    Simplified: []
};

let pdf = null;


/* =========================================================
   PDF LOADING
========================================================= */

async function loadPDF() {

    try {

        pdf = await pdfjsLib.getDocument(PDF_FILE).promise;

        console.log("1929 Gregg Manual loaded.");

    } catch (error) {

        console.error("PDF could not be loaded:", error);

    }
}


/* =========================================================
   DICTIONARY LOADING
========================================================= */

async function loadDictionary(edition) {

    if (dictionary[edition].length > 0)
        return;

    try {

        const response = await fetch(
            DICTIONARY[edition] + "?v=" + Date.now()
        );

        dictionary[edition] = await response.json();

    } catch (error) {

        console.error("Dictionary error:", error);

    }
}


/* =========================================================
   NORMALIZE WORD
========================================================= */

function cleanWord(word) {

    return word
        .toLowerCase()
        .replace(/^[^a-z0-9']+|[^a-z0-9']+$/gi, "");

}


/* =========================================================
   DICTIONARY LOOKUP
========================================================= */

function dictionaryLookup(word) {

    const clean = cleanWord(word);

    return dictionary[currentEdition].find(
        item => item.t.toLowerCase() === clean
    );

}


/* =========================================================
   BOOK PHRASES
=========================================================

   IMPORTANT:

   These are taken from the actual 1929 manual.

   "Dear Sir" = page 26
   "I am"     = page 31

========================================================= */

const BOOK_PHRASES = {

    "dear sir": {
        page: 26,

        // normalized coordinates
        // around the "Dear Sir" outline
        crop: {
            x: 0.66,
            y: 0.65,
            width: 0.23,
            height: 0.15
        },

        source: "1929 Manual — Business Abbreviation"
    },

    "i am": {
        page: 31,

        // normalized coordinates
        // around the "I am" outline
        crop: {
            x: 0.23,
            y: 0.77,
            width: 0.22,
            height: 0.12
        },

        source: "1929 Manual — Phrase Drill"
    }

};


/* =========================================================
   RENDER BOOK PHRASE
========================================================= */

async function createBookOutline(entry) {

    if (!pdf)
        return null;

    try {

        const page = await pdf.getPage(entry.page);

        /*
            Render the PDF page to an offscreen canvas.
        */

        const viewport = page.getViewport({
            scale: 2
        });

        const canvas = document.createElement("canvas");

        const context = canvas.getContext("2d");

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        await page.render({
            canvasContext: context,
            viewport: viewport
        }).promise;


        /*
            Convert normalized coordinates
            into actual pixel coordinates.
        */

        const x = entry.crop.x * canvas.width;
        const y = entry.crop.y * canvas.height;

        const width = entry.crop.width * canvas.width;
        const height = entry.crop.height * canvas.height;


        /*
            Create cropped canvas.
        */

        const cropCanvas = document.createElement("canvas");

        cropCanvas.width = width;
        cropCanvas.height = height;

        const cropContext = cropCanvas.getContext("2d");

        cropContext.drawImage(
            canvas,
            x,
            y,
            width,
            height,
            0,
            0,
            width,
            height
        );


        return cropCanvas.toDataURL("image/png");

    } catch (error) {

        console.error("Book rendering error:", error);

        return null;

    }

}


/* =========================================================
   CREATE DICTIONARY IMAGE
========================================================= */

function createDictionaryOutline(entry) {

    if (!entry)
        return null;

    const pageNumber =
        String(entry.page).padStart(3, "0");

    const imageURL =
        `https://raw.githubusercontent.com/richyliu/greggdict/master/assets/${currentEdition}/pages/${pageNumber}.png`;


    const DISPLAY_WIDTH = 365;
    const DISPLAY_HEIGHT = 100;
    const OFFSET = 5;
    const IMG_WIDTH = 1281;


    const wrapper = document.createElement("div");

    wrapper.className = "outline";


    const img = document.createElement("img");

    img.src = imageURL + "?v=" + Date.now();

    img.style.width = IMG_WIDTH + "px";


    img.onload = function() {

        const scale =
            IMG_WIDTH / img.naturalWidth;

        img.style.left =
            -(entry.x * scale - OFFSET) + "px";

        img.style.top =
            -(entry.y * scale - DISPLAY_HEIGHT / 2) + "px";

    };


    wrapper.appendChild(img);

    return wrapper;

}


/* =========================================================
   MATCH PHRASES FIRST
========================================================= */

function tokenize(text) {

    return text
        .trim()
        .split(/\s+/)
        .map(cleanWord)
        .filter(Boolean);

}


function findMatches(words) {

    const results = [];

    let i = 0;


    while (i < words.length) {

        let matched = false;


        /*
            Check longest phrases first.

            Example:

            "dear sir"

            gets matched before:

            "dear"
            "sir"
        */

        for (let length = 4; length >= 2; length--) {

            const phrase =
                words
                    .slice(i, i + length)
                    .join(" ");


            if (BOOK_PHRASES[phrase]) {

                results.push({
                    type: "book",
                    text: phrase,
                    entry: BOOK_PHRASES[phrase]
                });

                i += length;

                matched = true;

                break;
            }

        }


        if (!matched) {

            results.push({
                type: "word",
                text: words[i]
            });

            i++;

        }

    }

    return results;

}


/* =========================================================
   DISPLAY RESULTS
========================================================= */

async function convert() {

    const text =
        document.getElementById("input").value;

    const results =
        document.getElementById("results");

    results.innerHTML = "";


    if (!text.trim())
        return;


    await loadDictionary(currentEdition);


    const words =
        tokenize(text);


    const matches =
        findMatches(words);


    for (const item of matches) {

        const card =
            document.createElement("div");

        card.className = "card";


        const label =
            document.createElement("div");

        label.className = "word";

        label.innerHTML = `
            ${item.text}
            <div class="source"></div>
        `;


        const source =
            label.querySelector(".source");


        card.appendChild(label);


        /*
            BOOK PHRASE
        */

        if (item.type === "book") {

            source.textContent =
                item.entry.source;


            const image =
                await createBookOutline(item.entry);


            if (image) {

                const imageElement =
                    document.createElement("img");

                imageElement.src = image;

                imageElement.style.width = "365px";

                imageElement.style.height = "100px";

                imageElement.style.objectFit = "contain";

                card.appendChild(imageElement);

            } else {

                source.textContent +=
                    " — image unavailable";

            }

        }


        /*
            NORMAL DICTIONARY WORD
        */

        else {

            const entry =
                dictionaryLookup(item.text);


            if (entry) {

                source.textContent =
                    currentEdition + " Dictionary";


                const outline =
                    createDictionaryOutline(entry);


                card.appendChild(outline);

            } else {

                source.textContent =
                    "Not found";

                const message =
                    document.createElement("div");

                message.className = "error";

                message.textContent =
                    "No outline found";

                card.appendChild(message);

            }

        }


        results.appendChild(card);

    }

}


/* =========================================================
   EVENTS
========================================================= */

let typingTimer;

document
    .getElementById("input")
    .addEventListener("input", () => {

        clearTimeout(typingTimer);

        typingTimer =
            setTimeout(convert, 250);

    });


document
    .getElementById("annBtn")
    .addEventListener("click", async () => {

        currentEdition = "Anniversary";

        document
            .getElementById("annBtn")
            .classList.add("active");

        document
            .getElementById("simpBtn")
            .classList.remove("active");

        await convert();

    });


document
    .getElementById("simpBtn")
    .addEventListener("click", async () => {

        currentEdition = "Simplified";

        document
            .getElementById("simpBtn")
            .classList.add("active");

        document
            .getElementById("annBtn")
            .classList.remove("active");

        await convert();

    });


/* =========================================================
   START
========================================================= */

loadPDF();
loadDictionary("Anniversary");

</script>

</body>
</html>
