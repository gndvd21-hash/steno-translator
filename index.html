<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gregg Transcriber</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: white;
      padding: 20px 30px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    select {
      padding: 9px 14px;
      font-size: 15px;
      border: 1px solid #bbb;
      border-radius: 6px;
    }

    main {
      max-width: 1300px;
      margin: 25px auto;
      padding: 0 20px;
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .panel {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      overflow: hidden;
    }

    .panel-title {
      padding: 14px 18px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
      background: #fafafa;
    }

    textarea {
      width: 100%;
      height: 500px;
      padding: 20px;
      border: none;
      outline: none;
      resize: vertical;
      font-size: 18px;
      line-height: 1.6;
      font-family: Arial, sans-serif;
    }

    #output {
      height: 500px;
      overflow-y: auto;
      padding: 20px;
    }

    .word-row {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 20px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      align-items: center;
    }

    .english-word {
      font-weight: bold;
      font-size: 17px;
    }

    .steno-placeholder {
      color: #777;
      font-size: 16px;
      font-style: italic;
    }

    .info {
      margin-top: 15px;
      color: #666;
      font-size: 14px;
    }

    @media (max-width: 800px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .word-row {
        grid-template-columns: 120px 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Gregg Transcriber</h1>

  <div>
    <label for="series">Gregg Series: </label>

    <select id="series">
      <option value="Anniversary">Anniversary</option>
      <option value="Simplified">Simplified</option>
    </select>
  </div>
</header>

<main>

  <div class="workspace">

    <!-- LEFT SIDE -->
    <div class="panel">
      <div class="panel-title">
        English / Text
      </div>

      <textarea id="textInput" placeholder="Type or paste your English text here...">The court is now in session.

Please take note of the proceedings.</textarea>
    </div>


    <!-- RIGHT SIDE -->
    <div class="panel">
      <div class="panel-title">
        Gregg Shorthand
      </div>

      <div id="output"></div>
    </div>

  </div>

  <div class="info">
    Prototype 1 — English text is currently converted into a word-by-word Gregg output layout.
  </div>

</main>


<script>

const textInput = document.getElementById("textInput");
const output = document.getElementById("output");
const series = document.getElementById("series");


function updateOutput() {

  const text = textInput.value;

  /*
    Separate the English text into words.
  */
  const words = text.match(/[A-Za-z']+/g) || [];

  output.innerHTML = "";


  words.forEach(function(word) {

    const row = document.createElement("div");

    row.className = "word-row";


    const english = document.createElement("div");

    english.className = "english-word";

    english.textContent = word;


    const steno = document.createElement("div");

    steno.className = "steno-placeholder";

    steno.textContent =
      "[ Gregg " + series.value + " outline will appear here ]";


    row.appendChild(english);

    row.appendChild(steno);

    output.appendChild(row);

  });

}


textInput.addEventListener("input", updateOutput);

series.addEventListener("change", updateOutput);


updateOutput();

</script>

</body>
</html>
