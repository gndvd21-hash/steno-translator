<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English to Gregg Shorthand Lookup</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; padding: 20px; background-color: #f4f6f8; }
        header { text-align: center; margin-bottom: 20px; }
        .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; align-items: center; }
        .container { display: flex; gap: 20px; height: 75vh; }
        .panel { flex: 1; background: #fff; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        textarea { width: 100%; height: 60%; border: 1px solid #ccc; border-radius: 4px; padding: 10px; font-size: 16px; resize: none; margin-bottom: 10px; }
        .word-list { flex: 1; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; padding: 10px; border: 1px solid #eee; background: #fafafa; border-radius: 4px; }
        .word-btn { background: #007bff; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .word-btn:hover { background: #0056b3; }
        iframe { width: 100%; height: 100%; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <h2>English to Gregg Shorthand Lookup</h2>
</header>

<div class="controls">
    <label><strong>Edition:</strong></label>
    <input type="radio" id="anniversary" name="edition" value="an" checked onchange="updateSearch()">
    <label for="anniversary">Anniversary</label>
    
    <input type="radio" id="simplified" name="edition" value="sm" onchange="updateSearch()">
    <label for="simplified">Simplified</label>
</div>

<div class="container">
    <div class="panel">
        <h3>English Text</h3>
        <textarea id="inputText" placeholder="Type or paste your text here..." oninput="processText()"></textarea>
        <h4>Click a word to search dictionary:</h4>
        <div id="wordButtons" class="word-list"></div>
    </div>
    
    <div class="panel">
        <h3>Gregg Dictionary View</h3>
        <iframe id="dictFrame" src="https://greggdict.rliu.dev/"></iframe>
    </div>
</div>

<script>
    let currentSelectedWord = '';

    function processText() {
        const text = document.getElementById('inputText').value;
        const container = document.getElementById('wordButtons');
        container.innerHTML = '';
        
        if (!text.trim()) return;

        const words = [...new Set(text.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/))];

        words.forEach(word => {
            if (!word) return;
            const btn = document.createElement('button');
            btn.className = 'word-btn';
            btn.innerText = word;
            btn.onclick = () => searchWord(word);
            container.appendChild(btn);
        });

        if (words.length > 0 && !currentSelectedWord) {
            searchWord(words[0]);
        }
    }

    function searchWord(word) {
        currentSelectedWord = word;
        updateSearch();
    }

    function updateSearch() {
        if (!currentSelectedWord) return;
        const frame = document.getElementById('dictFrame');
        frame.src = `https://greggdict.rliu.dev/?search=${currentSelectedWord}`;
    }
</script>

</body>
</html>
